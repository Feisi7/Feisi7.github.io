<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BEE BROS · 明烁的战地账本</title>
<style>
    :root {
        --bg-base: #0c0e10;
        --bg-card: #14181c;
        --bg-elevated: #1c2028;
        --steel: #6a7a8a;
        --steel-bright: #9ab0c0;
        --warm: #c8a880;
        --warm-bright: #e8c8a0;
        --red: #a85050;
        --red-bright: #d47a6a;
        --text-main: #dce0e4;
        --text-dim: #7a8490;
        --border-dim: #222830;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; background-color: var(--bg-base); color: var(--text-main); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
            radial-gradient(900px 600px at 50% -10%, rgba(106,122,138,0.08), transparent 70%),
            radial-gradient(700px 500px at 110% 105%, rgba(200,168,128,0.05), transparent 70%),
            repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(34,40,48,0.3) 50px, rgba(34,40,48,0.3) 51px);
    }

    /* ============ 验证入口 ============ */
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .gate-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-dim); padding: 28px 22px; border-radius: 2px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; }
    .gate-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--steel), var(--warm), transparent); }
    .gate-box::after { content: 'BEE BROS · 战地存档'; position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: var(--steel); letter-spacing: 2px; }

    .seal-logo { width: 66px; height: 66px; margin: 0 auto 14px; border: 1.5px solid var(--steel); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 24px rgba(106,122,138,0.15); background: var(--bg-elevated); position: relative; }
    .seal-logo::after { content: ''; position: absolute; inset: 4px; border: 1px dashed rgba(106,122,138,0.25); border-radius: 50%; }
    .seal-logo span { color: var(--steel-bright); font-family: "Songti SC", serif; }
    .gate-title { text-align: center; font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 24px; }

    .gq { font-size: 13px; color: var(--steel-bright); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .gq::before { content: '✚'; font-size: 14px; color: var(--red); }
    .gtext { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }
    .gtext b { color: var(--text-main); font-weight: normal; }

    .gopts { display: flex; flex-direction: column; gap: 9px; }
    .gbtn { background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 12px 15px; text-align: left; border-radius: 2px; transition: all 0.2s; font-size: 14px; line-height: 1.6; color: var(--text-main); }
    .gbtn:active { background: rgba(106,122,138,0.1); border-color: var(--steel); color: var(--steel-bright); }

    .gnote { margin-top: 14px; font-size: 12px; color: var(--warm); line-height: 1.85; min-height: 20px; }

    .handwrite { font-size: 15px; color: var(--warm-bright); line-height: 2; padding: 16px; border-left: 2px solid var(--red); background: rgba(168,80,80,0.04); margin: 18px 0; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; }
    .handwrite.show { opacity: 1; transform: none; }

    .stamp { display: inline-block; border: 2px solid var(--steel); color: var(--steel); padding: 5px 15px; font-size: 13px; font-weight: bold; letter-spacing: 2px; transform: rotate(-2deg); margin-bottom: 18px; opacity: 0; }
    .stamp.show { opacity: 1; animation: stampIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes stampIn { 0% { transform: rotate(-10deg) scale(2); opacity: 0; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }

    .enter-btn { width: 100%; background: transparent; border: 1px solid var(--steel); color: var(--steel); padding: 12px; font-size: 15px; letter-spacing: 5px; border-radius: 2px; margin-top: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .enter-btn.show { opacity: 1; pointer-events: auto; }
    .enter-btn:active { background: rgba(106,122,138,0.1); }

    /* ============ 主体 ============ */
    #app { display: none; max-width: 540px; margin: 0 auto; padding: 0 15px 50px; opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: rgba(12,14,16,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-dim); margin-bottom: 15px; }
    .h-left { display: flex; align-items: center; gap: 11px; }
    .h-seal { width: 34px; height: 34px; border: 1px solid var(--steel); color: var(--steel); display: flex; align-items: center; justify-content: center; font-size: 15px; border-radius: 50%; background: var(--bg-elevated); font-family: "Songti SC", serif; }
    .h-title { font-size: 14px; color: var(--text-main); letter-spacing: 1px; }
    .h-sub { font-size: 11px; color: var(--warm); letter-spacing: 0.5px; }
    .pill { border: 1px solid var(--border-dim); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); transition: 0.2s; background: var(--bg-card); }
    .pill.on { border-color: var(--steel); color: var(--steel); background: rgba(106,122,138,0.08); }

    .card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 2px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--steel), var(--warm), transparent); opacity: 0.5; }
    .card-title { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

    .total-num { font-size: 31px; color: var(--steel-bright); font-family: Georgia, serif; text-shadow: 0 0 20px rgba(106,122,138,0.2); cursor: pointer; word-break: break-all; transition: text-shadow 0.2s; }
    .total-num:active { text-shadow: 0 0 32px rgba(154,176,192,0.7); }
    .total-meta { font-size: 12px; color: var(--warm); margin-top: 5px; }
    .total-note { font-size: 12px; color: var(--red-bright); margin-top: 10px; min-height: 18px; line-height: 1.7; }

    .chart-row { margin-bottom: 10px; }
    .chart-row:last-child { margin-bottom: 0; }
    .chart-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .chart-val { color: var(--steel-bright); font-family: Georgia, serif; }
    .chart-track { height: 5px; background: var(--bg-elevated); border-radius: 1px; overflow: hidden; }
    .chart-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--steel), var(--warm)); transition: width 0.1s linear; }

    .asset-cat { margin-bottom: 4px; }
    .cat-head { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-dim); color: var(--steel); font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .cat-val { color: var(--steel-bright); font-family: Georgia, serif; font-weight: normal; }
    .asset-item { padding: 10px 0; border-bottom: 1px dashed var(--border-dim); }
    .asset-item:last-child { border-bottom: none; }
    .ai-top { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
    .ai-top span:first-child { flex: 1; }
    .ai-val { color: var(--steel-bright); font-family: Georgia, serif; white-space: nowrap; }
    .ai-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }

    /* 私密空间 */
    .priv-locked { text-align: center; padding: 15px 0; }
    .lock-text { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 2px; }
    .gold-btn { border: 1px solid var(--steel); color: var(--steel); padding: 8px 24px; border-radius: 2px; font-size: 13px; letter-spacing: 2px; transition: 0.2s; background: var(--bg-card); }
    .gold-btn:active { background: rgba(106,122,138,0.1); }

    .priv-note { font-size: 12px; color: var(--text-dim); padding-bottom: 10px; border-bottom: 1px dashed var(--border-dim); margin-bottom: 10px; line-height: 1.7; }
    .pitem { border-bottom: 1px dashed var(--border-dim); }
    .pitem:last-child { border-bottom: none; }
    .pitem-head { width: 100%; text-align: left; padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; transition: color 0.2s; gap: 10px; }
    .pitem-head span:first-child { flex: 1; }
    .pitem-head:active { color: var(--steel); }
    .pitem-head::before { content: '✚'; margin-right: 8px; font-size: 12px; color: var(--red); }
    .pitem-body { padding-bottom: 15px; display: none; }
    .pitem.open .pitem-body { display: block; animation: fadeIn 0.3s ease; }
    .pstory { font-size: 13px; color: var(--text-main); line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--warm); margin-bottom: 12px; }
    .popt { display: block; width: 100%; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 2px; transition: 0.2s; line-height: 1.6; }
    .popt:active { border-color: var(--steel); color: var(--steel-bright); }
    .pres { font-size: 13px; color: var(--warm-bright); padding: 11px 12px; border: 1px solid rgba(200,168,128,0.3); background: rgba(200,168,128,0.04); border-radius: 2px; animation: fadeIn 0.3s ease; line-height: 1.75; }

    /* 消息浮层 */
    #msg-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; pointer-events: none; display: none; }
    .msg-card { background: var(--bg-elevated); border: 1px solid var(--steel); border-radius: 2px; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.85); pointer-events: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.1) both; max-width: 540px; margin: 0 auto; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg-from { font-size: 11px; color: var(--steel); margin-bottom: 6px; letter-spacing: 2px; }
    .msg-text { font-size: 14px; color: var(--text-main); margin-bottom: 12px; padding-right: 20px; line-height: 1.75; }
    .msg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg-btn { background: var(--bg-base); border: 1px solid var(--border-dim); padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-radius: 2px; transition: 0.2s; }
    .msg-btn:active { border-color: var(--steel); color: var(--steel-bright); }
    .msg-x { position: absolute; top: 10px; right: 10px; font-size: 18px; color: var(--text-dim); padding: 5px; transition: color 0.2s; }
    .msg-x:active { color: var(--steel); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-elevated); border: 1px solid var(--steel); color: var(--steel-bright); padding: 9px 16px; border-radius: 2px; font-size: 13px; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; max-width: 90vw; line-height: 1.6; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- 验证入口 -->
<div id="gate">
    <div class="gate-box">
        <div class="seal-logo"><span>明</span></div>
        <div class="gate-title">B E E B R O S · 明 烁 的 战 地 账 本</div>
        <div id="gateStep"></div>
        <div class="gnote" style="text-align: center; margin-top: 18px;">每一个名字，我都记得</div>
    </div>
</div>

<!-- 主体 -->
<div id="app">
    <div class="header">
        <div class="h-left">
            <div class="h-seal">明</div>
            <div>
                <div class="h-title">明烁的战地账本</div>
                <div class="h-sub" id="permLabel">权限：他记得的人</div>
            </div>
        </div>
        <button class="pill" id="pauseBtn">暂停消息</button>
    </div>

    <div class="card">
        <div class="card-title">全部家当</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-meta" id="rateInfo">每秒进项 +0</div>
        <div class="total-note" id="totalNote"></div>
    </div>

    <div class="card">
        <div class="card-title">家当配比</div>
        <div id="chart"></div>
    </div>

    <div class="card">
        <div class="card-title">明细</div>
        <div id="assetList"></div>
    </div>

    <div class="card">
        <div class="card-title">他记住的东西</div>
        <div id="privBody"></div>
    </div>
</div>

<!-- 消息浮层 -->
<div id="msg-wrap">
    <div class="msg-card">
        <button class="msg-x" id="msgX">×</button>
        <div class="msg-from">明 烁</div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-opts" id="msgOpts"></div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    const fmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    /* ================= 数据配置 ================= */
    const DATA = [
        {
            cat: '007城 · 医疗资源',
            short: '医疗资源',
            items: [
                { n: '战地医疗物资库存', b: 5200000, r: 800, note: '007城公认最优秀的医生。物资永远不够。' },
                { n: '外科手术技术估值', b: 0, r: 0, note: '靠自己钻研掌握绝大部分外科手术技术。无法计价。' },
                { n: '包裹式机械臂（医疗/战斗双模式）', b: 0, r: 0, note: '黎朝设计的。高强度手术时维持手臂稳定精准。' }
            ]
        },
        {
            cat: '战场 · 记录与记忆',
            short: '战场记录',
            items: [
                { n: '伤员记录名册', b: 0, r: 0, note: '每一个名字都记得。没时间哭，只能记住。' },
                { n: '前线战斗记录', b: 0, r: 0, note: '特殊情况下也会作为战士在前线战斗。' }
            ]
        },
        {
            cat: '明烁 · 个人持有',
            short: '个人持有',
            items: [
                { n: '手术器械套装', b: 8600, r: 2, note: '手上的刀是冰冷的。但他不是。' },
                { n: '不能吃辣的饮食禁忌', b: 0, r: 0, note: '有人亲眼见过他吃了一口辣椒，连耳朵都辣红了。' }
            ]
        },
        {
            cat: '你 · 他记得的人',
            short: '他记得的人',
            items: [
                { n: '此时此刻，我的心是茂盛的', b: 0, r: 0, note: '战争结束了。你还在。那就好。' }
            ]
        }
    ];

    let T0 = 0;
    let updateTimer = null;

    /* ================= 入口验证 ================= */
    let gateStep = 0;
    const gateEl = document.getElementById('gateStep');

    function renderGate() {
        if (gateStep === 0) {
            gateEl.innerHTML = `
                <div class="gq">壹 · 来者何人</div>
                <div class="gtext">这是明烁的账本。他刚做完一台手术，机械臂还没卸下来。<br><b>你记得几个名字？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="patient">被 他 救 过 的 伤 员</button>
                    <button class="gbtn" data-v="colleague">同 队 的 战 友</button>
                    <button class="gbtn" data-v="remembered">他 记 得 的 人</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'remembered') {
                        document.getElementById('gNote').innerText = "他抬起头，看了你很久。机械臂发出轻微的嗡鸣。\n「……嗯。我记得你。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2400);
                    } else if (btn.dataset.v === 'colleague') {
                        document.getElementById('gNote').innerText = "「战友。嗯。战场上，谁都是战友。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    } else {
                        document.getElementById('gNote').innerText = "「伤员。……那先回答我一题。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 1) {
            gateEl.innerHTML = `
                <div class="gq">贰 · 战场校验</div>
                <div class="gtext">千城会议后，007城发动武装反抗。<br><b>明烁在战争中做了什么？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="a">只做后方支援，不上前线</button>
                    <button class="gbtn" data-v="b">不仅做后方支援，特殊情况下也作为战士在前线战斗</button>
                    <button class="gbtn" data-v="c">没有参与战争</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'b') {
                        gateStep = 2; renderGate();
                    } else {
                        document.getElementById('gNote').innerText = "「……不对。再想。伤员等不了。」";
                    }
                };
            });
        } else if (gateStep === 2) {
            gateEl.innerHTML = `
                <div class="gq">叁 · 确认</div>
                <div class="gtext">账本里有医疗物资、伤员名册、不能吃辣。<br><b>你确定要看吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="yes">看 吧，我 不 怕 战 场</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelector('.gbtn').onclick = () => {
                document.getElementById('gNote').innerText = "「那进来吧。……别碰那些器械。碰我就好。」";
                setTimeout(() => { gateStep = 3; renderGate(); }, 1600);
            };
        } else {
            gateEl.innerHTML = `
                <div class="gq">肆 · 明烁的话</div>
                <div class="handwrite" id="hw">「我所参与的战争，<br>不是保护高楼和机械，<br>而是守住那些心脏还在跳动的人。<br><br>“茂盛”这个词，<br>在我这里可以非常简单。<br>比如说——<br>此时此刻，我的心是茂盛的。<br><br>战争结束了。<br>你还在。<br>那就好。」</div>
                <div id="stampBox"></div>
            `;
            setTimeout(() => { document.getElementById('hw').classList.add('show'); }, 500);
            setTimeout(() => {
                document.getElementById('stampBox').innerHTML = `
                    <div class="stamp show">认证：他记得的人</div>
                    <button class="enter-btn show" id="enterBtn">翻 开 账 本</button>
                `;
                document.getElementById('enterBtn').onclick = enterApp;
            }, 3000);
        }
    }

    /* ================= 进入主体 ================= */
    function enterApp() {
        document.getElementById('gate').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = 'block';
        setTimeout(() => app.classList.add('show'), 50);

        T0 = performance.now();
        buildAssets();
        buildChart();
        updateAll();

        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(updateAll, 100);

        scheduleMsg(7000);
    }

    /* ================= 资产系统 ================= */
    function buildAssets() {
        const wrap = document.getElementById('assetList');
        let html = '';
        DATA.forEach((c, ci) => {
            html += `<div class="asset-cat">
                <div class="cat-head"><span>${c.cat}</span><span class="cat-val" id="c_${ci}">—</span></div>`;
            c.items.forEach((it, ii) => {
                html += `<div class="asset-item">
                    <div class="ai-top"><span>${it.n}</span><span class="ai-val" id="v_${ci}_${ii}">—</span></div>
                    <div class="ai-note">${it.note}</div>
                </div>`;
            });
            html += '</div>';
        });
        wrap.innerHTML = html;
    }

    function buildChart() {
        const el = document.getElementById('chart');
        let html = '';
        DATA.forEach((c, i) => {
            html += `<div class="chart-row">
                <div class="chart-top"><span>${c.short}</span><span class="chart-val" id="chv_${i}">—</span></div>
                <div class="chart-track"><div class="chart-fill" id="bar_${i}"></div></div>
            </div>`;
        });
        el.innerHTML = html;

        let rate = 0;
        DATA.forEach(c => c.items.forEach(it => rate += it.r));
        document.getElementById('rateInfo').innerText = `每秒进项 +${fmt(rate)}`;
    }

    function updateAll() {
        const e = (performance.now() - T0) / 1000;
        let catVals = [];
        let total = 0;

        DATA.forEach((c, ci) => {
            let s = 0;
            c.items.forEach((it, ii) => {
                let v = it.b + it.r * e;
                s += v;
                const node = document.getElementById(`v_${ci}_${ii}`);
                if (node) {
                    if (it.b === 0 && it.r === 0) {
                        node.innerText = it.note.includes('你还在') ? '记得' : '无法计价';
                    } else {
                        node.innerText = fmt(v);
                    }
                }
            });
            catVals.push(s);
            total += s;
            const cn = document.getElementById(`c_${ci}`);
            if (cn) cn.innerText = (s === 0) ? '—' : fmt(s);
        });

        document.getElementById('totalNum').innerText = fmt(total);

        const max = Math.max(...catVals, 1);
        catVals.forEach((v, i) => {
            const bar = document.getElementById(`bar_${i}`);
            if (bar) bar.style.width = (v <= 0 ? 0 : Math.max(1, (v / max) * 100)) + '%';
            const cv = document.getElementById(`chv_${i}`);
            if (cv) cv.innerText = (v <= 0) ? '无价' : fmt(v);
        });
    }

    /* ================= 消息系统 ================= */
    const MSGS = [
        { t: '看到伤员名册那栏了吗。每一个名字我都记得。没时间哭，只能记住。', o: [
            { l: '你记得多少个', r: '「……很多。有些已经不在了。但名字还在。」' },
            { l: '我也记住了你', r: '「……那就好。被记住的人，不会真的消失。」' }
        ]},
        { t: '不能吃辣那栏，是不是有点好笑。上次吃了一口辣椒，连耳朵都辣红了。', o: [
            { l: '那你还吃吗', r: '「……偶尔。有人递过来的时候。」' },
            { l: '下次我帮你挑不辣的', r: '「……好。你挑的，我都吃。」' }
        ]},
        { t: '黎朝给我做的那条机械臂，医疗和战斗双模式。他手很巧。', o: [
            { l: '你用过战斗模式吗', r: '「用过。……不怎么喜欢。但需要的时候，没得选。」' },
            { l: '你更喜欢医疗模式', r: '「嗯。救人比伤人好。」' }
        ]},
        { t: '“茂盛”这个词，在我这里可以非常简单。此时此刻，我的心是茂盛的。', o: [
            { l: '因为战争结束了', r: '「因为战争结束了。而且……你还在。」' },
            { l: '我也一样', r: '「……那就好。那我就放心了。」' }
        ]}
    ];

    let msgIdx = 0, msgTimer = null, msgOpen = false, msgPaused = false;

    function scheduleMsg(delay) {
        clearTimeout(msgTimer);
        if (msgPaused) return;
        msgTimer = setTimeout(() => {
            if (msgPaused || msgOpen) return;
            showMsg();
        }, delay || 15000);
    }

    function showMsg() {
        const m = MSGS[msgIdx % MSGS.length];
        msgIdx++;
        msgOpen = true;
        document.getElementById('msgText').innerText = m.t;
        const opts = document.getElementById('msgOpts');
        opts.innerHTML = '';

        m.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'msg-btn';
            b.innerText = o.l;
            b.onclick = () => {
                opts.innerHTML = `<div class="pres">${o.r}</div>`;
                setTimeout(closeMsg, 3200);
            };
            opts.appendChild(b);
        });

        document.getElementById('msg-wrap').style.display = 'block';
    }

    function closeMsg() {
        const scrollPos = window.scrollY;
        document.getElementById('msg-wrap').style.display = 'none';
        msgOpen = false;
        window.scrollTo(0, scrollPos);
        scheduleMsg(15000);
    }

    document.getElementById('msgX').onclick = closeMsg;

    document.getElementById('pauseBtn').onclick = function() {
        msgPaused = !msgPaused;
        this.innerText = msgPaused ? '恢复消息' : '暂停消息';
        this.classList.toggle('on', msgPaused);
        if (msgPaused) clearTimeout(msgTimer);
        else if (!msgOpen) scheduleMsg(3000);
    };

    /* ================= 他记住的东西 ================= */
    const PRIV = [
        { id: 'roster', name: '那本记满名字的伤员名册', story: '很旧了，边角磨得发毛。每一个名字后面都标了日期和伤情。有些名字旁边画了一个很小的圈。', opts: [
            { l: '问圈是什么意思', r: '「……没能救回来的。圈起来，别忘了。」' },
            { l: '说这本子很重', r: '「嗯。比手术器械重。」' }
        ]},
        { id: 'ear', name: '被辣椒辣红的耳朵', story: '有人亲眼见过。他吃了一口辣椒，没说话，但耳朵尖红得像要滴血。', opts: [
            { l: '笑他不能吃辣', r: '「……笑什么。下次不吃了。」' },
            { l: '说这样很可爱', r: '「可爱？……你再说一遍？」' }
        ]},
        { id: 'arm', name: '机械臂上黎朝留下的调试笔记', story: '用小字写在机械臂内侧，很隐蔽的位置：“医疗模式已调至最稳。别逞强。”', opts: [
            { l: '问他和黎朝的关系', r: '「他做的。我用的。他手巧，我放心。」' },
            { l: '说黎朝很关心他', r: '「……嗯。所以得更小心。不能弄坏。」' }
        ]},
        { id: 'ruins', name: '某次前线战斗后他坐在废墟上的侧影', story: '没有照片。但有人记得。他坐在碎石上，机械臂垂在身侧，很久没动。', opts: [
            { l: '问他当时在想什么', r: '「在想……今天又有几个名字。要记下来。」' },
            { l: '说他那时候很累', r: '「累。但不能停。停了就记不住了。」' }
        ]}
    ];

    const EGG = {
        id: 'dawn',
        name: '他在曙光中回头',
        story: '战争结束了。他站在曙光里，脸上还有灰尘，目光坚毅。看到你的时候，他停了一下，然后说：“战争结束了。你还在。……那就好。”',
        opts: [
            { l: '走过去', r: '「……嗯。过来。让我看看你。」' },
            { l: '说我也记得你', r: '「……那就好。那我记的这些名字，就没白记。」' }
        ]
    };

    let privState = {};
    PRIV.forEach(p => privState[p.id] = { open: false, chosen: null });
    let privOpened = false, eggUnlocked = false;

    function renderPriv() {
        const body = document.getElementById('privBody');
        if (!privOpened) {
            body.innerHTML = `<div class="priv-locked">
                <div class="lock-text">他 记 住 的 东 西</div>
                <button class="gold-btn" id="openPriv">看 看 他 记 住 了 什 么</button>
            </div>`;
            document.getElementById('openPriv').onclick = () => {
                privOpened = true;
                renderPriv();
                toast('「这些东西……都是要记住的。不能忘。」');
            };
            return;
        }

        const list = PRIV.slice();
        if (eggUnlocked) list.push(EGG);

        let html = `<div class="priv-note">「有些是名字。有些是……别的。」</div>`;
        list.forEach(p => {
            const st = privState[p.id] || (privState[p.id] = { open: false, chosen: null });
            html += `<div class="pitem ${st.open ? 'open' : ''}">
                <button class="pitem-head" data-act="toggle" data-id="${p.id}">
                    <span>${p.name}</span><span>${st.open ? '−' : '+'}</span>
                </button>`;
            if (st.open) {
                html += `<div class="pitem-body">
                    <div class="pstory">${p.story}</div>`;
                if (st.chosen === null) {
                    p.opts.forEach((o, oi) => {
                        html += `<button class="popt" data-act="opt" data-id="${p.id}" data-oi="${oi}">${o.l}</button>`;
                    });
                } else {
                    html += `<div class="pres">${p.opts[st.chosen].r}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        });
        body.innerHTML = html;
    }

    document.getElementById('privBody').onclick = (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const id = t.dataset.id;
        const st = privState[id];
        if (!st) return;

        if (t.dataset.act === 'toggle') {
            st.open = !st.open;
            renderPriv();
        } else if (t.dataset.act === 'opt') {
            st.chosen = parseInt(t.dataset.oi, 10);
            renderPriv();
            checkEgg();
        }
    };

    function checkEgg() {
        if (eggUnlocked) return;
        const allDone = PRIV.every(p => privState[p.id] && privState[p.id].chosen !== null);
        if (!allDone) return;
        eggUnlocked = true;
        setTimeout(() => {
            renderPriv();
            toast('他在曙光中回头了。');
        }, 1000);
    }

    /* ================= 彩蛋与反馈 ================= */
    let tapN = 0;
    document.getElementById('totalNum').onclick = () => {
        tapN++;
        const note = document.getElementById('totalNote');
        if (tapN === 5) note.innerText = '账本边角画了一个小小的十字。是医疗符号。';
        else if (tapN === 10) note.innerText = '“再点，我就把你名字也记上去。……已经记了。”';
        else if (tapN === 15) note.innerText = '“行。你赢了。名字给你留着。一直留着。”';
    };

    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 启动验证
    renderGate();

})();
</script>
</body>
</html>
