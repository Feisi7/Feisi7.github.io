<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAN ONWIRE · 冷任非的委托账本</title>
<style>
    :root {
        --bg-base: #0a0f0c;
        --bg-card: #101812;
        --bg-elevated: #16201a;
        --forest: #3a5a44;
        --forest-bright: #5a7a5e;
        --gold: #b8a06a;
        --gold-bright: #e0c88a;
        --ice: #8ab0a8;
        --red-accent: #7a2a2a;
        --text-main: #dce4de;
        --text-dim: #7a8a7e;
        --border-dim: #1e2a22;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; background-color: var(--bg-base); color: var(--text-main); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
            radial-gradient(900px 600px at 50% -10%, rgba(58,90,68,0.12), transparent 70%),
            radial-gradient(700px 500px at 110% 105%, rgba(184,160,106,0.06), transparent 70%),
            repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(30,42,34,0.3) 48px, rgba(30,42,34,0.3) 49px);
    }

    /* ============ 验证入口 ============ */
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .gate-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-dim); padding: 28px 22px; border-radius: 2px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; }
    .gate-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), var(--forest), transparent); }
    .gate-box::after { content: 'MAN ONWIRE · 委托存档'; position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: var(--forest); letter-spacing: 2px; }

    .seal-logo { width: 66px; height: 66px; margin: 0 auto 14px; border: 1.5px solid var(--gold); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 24px rgba(184,160,106,0.15); background: var(--bg-elevated); transform: rotate(45deg); position: relative; }
    .seal-logo span { transform: rotate(-45deg); display: block; color: var(--gold); font-family: Georgia, serif; }
    .gate-title { text-align: center; font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 24px; }

    .gq { font-size: 13px; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .gq::before { content: '§'; font-size: 15px; color: var(--forest-bright); }
    .gtext { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }
    .gtext b { color: var(--text-main); font-weight: normal; }

    .gopts { display: flex; flex-direction: column; gap: 9px; }
    .gbtn { background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 12px 15px; text-align: left; border-radius: 2px; transition: all 0.2s; font-size: 14px; line-height: 1.6; color: var(--text-main); }
    .gbtn:active { background: rgba(184,160,106,0.08); border-color: var(--gold); color: var(--gold-bright); }

    .gnote { margin-top: 14px; font-size: 12px; color: var(--ice); line-height: 1.85; min-height: 20px; }

    .handwrite { font-size: 15px; color: var(--gold-bright); line-height: 2; padding: 16px; border-left: 2px solid var(--gold); background: rgba(184,160,106,0.04); margin: 18px 0; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; }
    .handwrite.show { opacity: 1; transform: none; }

    .stamp { display: inline-block; border: 2px solid var(--red-accent); color: var(--red-accent); padding: 5px 15px; font-size: 13px; font-weight: bold; letter-spacing: 2px; transform: rotate(-3deg); margin-bottom: 18px; opacity: 0; }
    .stamp.show { opacity: 1; animation: stampIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes stampIn { 0% { transform: rotate(-12deg) scale(2); opacity: 0; } 100% { transform: rotate(-3deg) scale(1); opacity: 1; } }

    .enter-btn { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px; font-size: 15px; letter-spacing: 5px; border-radius: 2px; margin-top: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .enter-btn.show { opacity: 1; pointer-events: auto; }
    .enter-btn:active { background: rgba(184,160,106,0.1); }

    /* ============ 主体 ============ */
    #app { display: none; max-width: 540px; margin: 0 auto; padding: 0 15px 50px; opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: rgba(10,15,12,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-dim); margin-bottom: 15px; }
    .h-left { display: flex; align-items: center; gap: 11px; }
    .h-seal { width: 34px; height: 34px; border: 1px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 15px; border-radius: 2px; background: var(--bg-elevated); font-family: Georgia, serif; }
    .h-title { font-size: 14px; color: var(--text-main); letter-spacing: 1px; }
    .h-sub { font-size: 11px; color: var(--forest-bright); letter-spacing: 0.5px; }
    .pill { border: 1px solid var(--border-dim); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); transition: 0.2s; background: var(--bg-card); }
    .pill.on { border-color: var(--gold); color: var(--gold); background: rgba(184,160,106,0.08); }

    .card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 2px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: linear-gradient(180deg, var(--gold), transparent); opacity: 0.5; }
    .card-title { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-left: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

    .total-num { font-size: 31px; color: var(--gold-bright); font-family: Georgia, serif; text-shadow: 0 0 20px rgba(184,160,106,0.2); cursor: pointer; word-break: break-all; transition: text-shadow 0.2s; padding-left: 8px; }
    .total-num:active { text-shadow: 0 0 32px rgba(224,200,138,0.7); }
    .total-meta { font-size: 12px; color: var(--forest-bright); margin-top: 5px; padding-left: 8px; }
    .total-note { font-size: 12px; color: var(--ice); margin-top: 10px; min-height: 18px; line-height: 1.7; padding-left: 8px; }

    .chart-row { margin-bottom: 10px; padding-left: 8px; }
    .chart-row:last-child { margin-bottom: 0; }
    .chart-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .chart-val { color: var(--gold-bright); font-family: Georgia, serif; }
    .chart-track { height: 5px; background: var(--bg-elevated); border-radius: 1px; overflow: hidden; }
    .chart-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--forest), var(--gold)); transition: width 0.1s linear; }

    .asset-cat { margin-bottom: 4px; padding-left: 8px; }
    .cat-head { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-dim); color: var(--gold); font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .cat-val { color: var(--gold-bright); font-family: Georgia, serif; font-weight: normal; }
    .asset-item { padding: 10px 0; border-bottom: 1px dashed var(--border-dim); }
    .asset-item:last-child { border-bottom: none; }
    .ai-top { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
    .ai-top span:first-child { flex: 1; }
    .ai-val { color: var(--gold-bright); font-family: Georgia, serif; white-space: nowrap; }
    .ai-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }

    /* 私密空间 */
    .priv-locked { text-align: center; padding: 15px 0; }
    .lock-text { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 2px; }
    .gold-btn { border: 1px solid var(--gold); color: var(--gold); padding: 8px 24px; border-radius: 2px; font-size: 13px; letter-spacing: 2px; transition: 0.2s; background: var(--bg-card); }
    .gold-btn:active { background: rgba(184,160,106,0.1); }

    .priv-note { font-size: 12px; color: var(--text-dim); padding-bottom: 10px; border-bottom: 1px dashed var(--border-dim); margin-bottom: 10px; line-height: 1.7; padding-left: 8px; }
    .pitem { border-bottom: 1px dashed var(--border-dim); padding-left: 8px; }
    .pitem:last-child { border-bottom: none; }
    .pitem-head { width: 100%; text-align: left; padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; transition: color 0.2s; gap: 10px; }
    .pitem-head span:first-child { flex: 1; }
    .pitem-head:active { color: var(--gold); }
    .pitem-head::before { content: '§'; margin-right: 8px; font-size: 13px; color: var(--forest-bright); }
    .pitem-body { padding-bottom: 15px; display: none; }
    .pitem.open .pitem-body { display: block; animation: fadeIn 0.3s ease; }
    .pstory { font-size: 13px; color: var(--text-main); line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--ice); margin-bottom: 12px; }
    .popt { display: block; width: 100%; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 2px; transition: 0.2s; line-height: 1.6; }
    .popt:active { border-color: var(--gold); color: var(--gold-bright); }
    .pres { font-size: 13px; color: var(--gold-bright); padding: 11px 12px; border: 1px solid rgba(184,160,106,0.3); background: rgba(184,160,106,0.04); border-radius: 2px; animation: fadeIn 0.3s ease; line-height: 1.75; }

    /* 消息浮层 */
    #msg-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; pointer-events: none; display: none; }
    .msg-card { background: var(--bg-elevated); border: 1px solid var(--gold); border-radius: 2px; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.85); pointer-events: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.1) both; max-width: 540px; margin: 0 auto; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg-from { font-size: 11px; color: var(--gold); margin-bottom: 6px; letter-spacing: 2px; }
    .msg-text { font-size: 14px; color: var(--text-main); margin-bottom: 12px; padding-right: 20px; line-height: 1.75; }
    .msg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg-btn { background: var(--bg-base); border: 1px solid var(--border-dim); padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-radius: 2px; transition: 0.2s; }
    .msg-btn:active { border-color: var(--gold); color: var(--gold-bright); }
    .msg-x { position: absolute; top: 10px; right: 10px; font-size: 18px; color: var(--text-dim); padding: 5px; transition: color 0.2s; }
    .msg-x:active { color: var(--gold); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-elevated); border: 1px solid var(--gold); color: var(--gold-bright); padding: 9px 16px; border-radius: 2px; font-size: 13px; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; max-width: 90vw; line-height: 1.6; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- 验证入口 -->
<div id="gate">
    <div class="gate-box">
        <div class="seal-logo"><span>H</span></div>
        <div class="gate-title">M A N O N W I R E · 冷 任 非 的 委 托 账 本</div>
        <div id="gateStep"></div>
        <div class="gnote" style="text-align: center; margin-top: 18px;">报酬由我来定</div>
    </div>
</div>

<!-- 主体 -->
<div id="app">
    <div class="header">
        <div class="h-left">
            <div class="h-seal">§</div>
            <div>
                <div class="h-title">冷任非的委托账本</div>
                <div class="h-sub" id="permLabel">权限：站在黑暗以外的人</div>
            </div>
        </div>
        <button class="pill" id="pauseBtn">暂停消息</button>
    </div>

    <div class="card">
        <div class="card-title">全部家当</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-meta" id="rateInfo">每秒进项 +0</div>
        <div class="total-note" id="totalNote"></div>
    </div>

    <div class="card">
        <div class="card-title">家当配比</div>
        <div id="chart"></div>
    </div>

    <div class="card">
        <div class="card-title">明细</div>
        <div id="assetList"></div>
    </div>

    <div class="card">
        <div class="card-title">他没写进账本的东西</div>
        <div id="privBody"></div>
    </div>
</div>

<!-- 消息浮层 -->
<div id="msg-wrap">
    <div class="msg-card">
        <button class="msg-x" id="msgX">×</button>
        <div class="msg-from">冷 任 非</div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-opts" id="msgOpts"></div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    const fmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    /* ================= 数据配置 ================= */
    const DATA = [
        {
            cat: '律所 · 委托与身价',
            short: '委托身价',
            items: [
                { n: '未结案件的委托金存底', b: 128000000, r: 4200, note: '报酬由我来定。这只是一部分。' },
                { n: '胜诉标的抽成', b: 68000000, r: 2600, note: '从无败诉。自然也不会少赚。' },
                { n: '律所排名上升估值', b: 156000000, r: 5800, note: '新开办一年，排名急速攀升。' }
            ]
        },
        {
            cat: '千城 · 隐秘法务关联',
            short: '隐秘关联',
            items: [
                { n: '清除性考核执行地通行权限', b: 0, r: 0, note: '传闻中的首席裁定官。制度非公开，无实际证据。' },
                { n: '辩护减刑/无罪结下的隐性债权', b: 42000000, r: 1200, note: '人情、把柄，都是可以变现的筹码。' }
            ]
        },
        {
            cat: '冷任非 · 个人持有',
            short: '个人持有',
            items: [
                { n: '牛奶与糖的私密库存', b: 18000, r: 2, note: '五块糖，少一块都不算。' },
                { n: '定制西装与领带', b: 520000, r: 18, note: '领带稍显浪费的那条。' },
                { n: '裁决羽刃', b: 0, r: 0, note: '非卖品。仅用于辩护。' }
            ]
        },
        {
            cat: '你 · 对世权',
            short: '对世权',
            items: [
                { n: '无期限、不可评估、不可转让', b: 0, r: 0, note: '你拥有我，无期限。' }
            ]
        }
    ];

    let T0 = 0;
    let updateTimer = null;

    /* ================= 入口验证 ================= */
    let gateStep = 0;
    const gateEl = document.getElementById('gateStep');

    function renderGate() {
        if (gateStep === 0) {
            gateEl.innerHTML = `
                <div class="gq">壹 · 身份声明</div>
                <div class="gtext">这是冷任非律师的委托账本。<br><b>你以什么身份站在这里？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="client">委 托 人</button>
                    <button class="gbtn" data-v="rival">对 方 律 师</button>
                    <button class="gbtn" data-v="you">站 在 黑 暗 以 外 的 人</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'you') {
                        document.getElementById('gNote').innerText = "终端沉默了几秒。然后传来一声极轻的、几乎听不出来的笑。\n「……你来了。我等你很久了。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2600);
                    } else if (btn.dataset.v === 'rival') {
                        document.getElementById('gNote').innerText = "「对方律师？上一个这么说的，现在还在上诉。」\n门没有开。但你发现自己被允许继续。";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2200);
                    } else {
                        document.getElementById('gNote').innerText = "「委托人。可以。但我的规矩，你得先弄清楚。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 1) {
            gateEl.innerHTML = `
                <div class="gq">贰 · 法条校验</div>
                <div class="gtext">他问过一个问题，没人答得上来。<br><b>正义？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="a">正义是法庭上最终的判决</button>
                    <button class="gbtn" data-v="b">正义是律师为当事人争取的最大利益</button>
                    <button class="gbtn" data-v="c">哪会有绝对的正义</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'c') {
                        gateStep = 2; renderGate();
                    } else {
                        document.getElementById('gNote').innerText = "「不要逗我发笑了。」他连眼皮都没抬。";
                    }
                };
            });
        } else if (gateStep === 2) {
            gateEl.innerHTML = `
                <div class="gq">叁 · 确认</div>
                <div class="gtext">账本里有委托金、隐性债权、五块糖。<br><b>你确定要看吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="yes">看 吧，我 不 怕 黑 暗</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelector('.gbtn').onclick = () => {
                document.getElementById('gNote').innerText = "「那进来吧。……别站太远。」";
                setTimeout(() => { gateStep = 3; renderGate(); }, 1600);
            };
        } else {
            gateEl.innerHTML = `
                <div class="gq">肆 · 冷任非的话</div>
                <div class="handwrite" id="hw">「正义？不要逗我发笑了，<br>哪会有绝对的正义。<br><br>被黑暗的罪孽包围，<br>却向往光明——<br>这大概就是我的规矩。<br><br>黑暗以外的地方，<br>你会带着我吗？」</div>
                <div id="stampBox"></div>
            `;
            setTimeout(() => { document.getElementById('hw').classList.add('show'); }, 500);
            setTimeout(() => {
                document.getElementById('stampBox').innerHTML = `
                    <div class="stamp show">权限已变更：对世权</div>
                    <button class="enter-btn show" id="enterBtn">翻 开 账 本</button>
                `;
                document.getElementById('enterBtn').onclick = enterApp;
            }, 3000);
        }
    }

    /* ================= 进入主体 ================= */
    function enterApp() {
        document.getElementById('gate').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = 'block';
        setTimeout(() => app.classList.add('show'), 50);

        T0 = performance.now();
        buildAssets();
        buildChart();
        updateAll();

        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(updateAll, 100);

        scheduleMsg(7000);
    }

    /* ================= 资产系统 ================= */
    function buildAssets() {
        const wrap = document.getElementById('assetList');
        let html = '';
        DATA.forEach((c, ci) => {
            html += `<div class="asset-cat">
                <div class="cat-head"><span>${c.cat}</span><span class="cat-val" id="c_${ci}">—</span></div>`;
            c.items.forEach((it, ii) => {
                html += `<div class="asset-item">
                    <div class="ai-top"><span>${it.n}</span><span class="ai-val" id="v_${ci}_${ii}">—</span></div>
                    <div class="ai-note">${it.note}</div>
                </div>`;
            });
            html += '</div>';
        });
        wrap.innerHTML = html;
    }

    function buildChart() {
        const el = document.getElementById('chart');
        let html = '';
        DATA.forEach((c, i) => {
            html += `<div class="chart-row">
                <div class="chart-top"><span>${c.short}</span><span class="chart-val" id="chv_${i}">—</span></div>
                <div class="chart-track"><div class="chart-fill" id="bar_${i}"></div></div>
            </div>`;
        });
        el.innerHTML = html;

        let rate = 0;
        DATA.forEach(c => c.items.forEach(it => rate += it.r));
        document.getElementById('rateInfo').innerText = `每秒进项 +${fmt(rate)}`;
    }

    function updateAll() {
        const e = (performance.now() - T0) / 1000;
        let catVals = [];
        let total = 0;

        DATA.forEach((c, ci) => {
            let s = 0;
            c.items.forEach((it, ii) => {
                let v = it.b + it.r * e;
                s += v;
                const node = document.getElementById(`v_${ci}_${ii}`);
                if (node) {
                    if (it.b === 0 && it.r === 0) {
                        node.innerText = it.note.includes('非卖品') ? '非卖品' : '无期限';
                    } else {
                        node.innerText = fmt(v);
                    }
                }
            });
            catVals.push(s);
            total += s;
            const cn = document.getElementById(`c_${ci}`);
            if (cn) cn.innerText = (s === 0) ? '—' : fmt(s);
        });

        document.getElementById('totalNum').innerText = fmt(total);

        const max = Math.max(...catVals, 1);
        catVals.forEach((v, i) => {
            const bar = document.getElementById(`bar_${i}`);
            if (bar) bar.style.width = (v <= 0 ? 0 : Math.max(1, (v / max) * 100)) + '%';
            const cv = document.getElementById(`chv_${i}`);
            if (cv) cv.innerText = (v <= 0) ? '无法计价' : fmt(v);
        });
    }

    /* ================= 消息系统 ================= */
    const MSGS = [
        { t: '看到“牛奶与糖”那栏了吗。五块糖，少一块都不算。别笑。这是规矩。', o: [
            { l: '我没笑', r: '「最好是。不然下次糖没了，我找你。」' },
            { l: '为什么是五块', r: '「……因为五块刚好。多一块太甜，少一块不够。」' }
        ]},
        { t: '有人问我为什么给恶人辩护。你说呢。正义这种东西，本来就不绝对。', o: [
            { l: '那你还向往光明', r: '「……被你发现了。被黑暗包围的人，才更知道光在哪。」' },
            { l: '我信你', r: '「……别这么说。我会当真的。」' }
        ]},
        { t: '那个小孩的玩具小熊。对，我拿走了。……我付钱了。放在他枕头底下。', o: [
            { l: '你为什么要拿', r: '「因为那只熊和某个人的很像。……算了，当我没说。」' },
            { l: '你其实很温柔', r: '「温柔？不要逗我发笑了。……不过，你这么说，我不讨厌。」' }
        ]},
        { t: '黑暗以外的地方，你会带着我吗。……我不是在问你。我是在要求你。', o: [
            { l: '我会', r: '「……好。那这次，轮到我信你。」' },
            { l: '你敢跟我走吗', r: '「有什么不敢的。我的规矩，报酬由我来定。这次的报酬，就是你。」' }
        ]}
    ];

    let msgIdx = 0, msgTimer = null, msgOpen = false, msgPaused = false;

    function scheduleMsg(delay) {
        clearTimeout(msgTimer);
        if (msgPaused) return;
        msgTimer = setTimeout(() => {
            if (msgPaused || msgOpen) return;
            showMsg();
        }, delay || 15000);
    }

    function showMsg() {
        const m = MSGS[msgIdx % MSGS.length];
        msgIdx++;
        msgOpen = true;
        document.getElementById('msgText').innerText = m.t;
        const opts = document.getElementById('msgOpts');
        opts.innerHTML = '';

        m.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'msg-btn';
            b.innerText = o.l;
            b.onclick = () => {
                opts.innerHTML = `<div class="pres">${o.r}</div>`;
                setTimeout(closeMsg, 3200);
            };
            opts.appendChild(b);
        });

        document.getElementById('msg-wrap').style.display = 'block';
    }

    function closeMsg() {
        const scrollPos = window.scrollY;
        document.getElementById('msg-wrap').style.display = 'none';
        msgOpen = false;
        window.scrollTo(0, scrollPos);
        scheduleMsg(15000);
    }

    document.getElementById('msgX').onclick = closeMsg;

    document.getElementById('pauseBtn').onclick = function() {
        msgPaused = !msgPaused;
        this.innerText = msgPaused ? '恢复消息' : '暂停消息';
        this.classList.toggle('on', msgPaused);
        if (msgPaused) clearTimeout(msgTimer);
        else if (!msgOpen) scheduleMsg(3000);
    };

    /* ================= 他没写进账本的东西 ================= */
    const PRIV = [
        { id: 'bear', name: '小孩那只玩具小熊', story: '他拿走了，但付了钱，放在小孩枕头底下。小熊的耳朵上有一小段手写标签：“和她的很像。”', opts: [
            { l: '问他“她”是谁', r: '「……一个我弄丢的人。或者，一个我还没找到的人。」' },
            { l: '把小熊放好', r: '「谢谢。别弄脏了。那是证据。」' }
        ]},
        { id: 'candy', name: '五块糖的包装纸', story: '每一张都压得平平整整，收在一个铁盒里。铁盒上贴着标签：“规矩”。', opts: [
            { l: '问他为什么收包装纸', r: '「因为糖吃完了，纸还在。就像……有些东西，人不在了，但证据还在。」' },
            { l: '说这太文艺了', r: '「文艺？这是证据保全。别笑。」' }
        ]},
        { id: 'record', name: '一张庭审记录背面的小字', story: '某次胜诉后的空白背面，只有一行极小的字，不是判决词。写着：“如果败诉的代价是她，那我宁愿从未执业。”', opts: [
            { l: '问他这是谁', r: '「……你猜。猜对了，糖分你一半。」' },
            { l: '安静地合上', r: '「谢谢。你没追问。……这让我有点意外。」' }
        ]},
        { id: 'card', name: '那张递给钢琴家的名片底稿', story: '剧院那晚，他递给准备炸毁剧院的钢琴家一张名片。底稿上写着：“报酬由我来定。”背面还有一行更小的字：“定的是你。”', opts: [
            { l: '问他定的是什么', r: '「……你。我定的是你。从那天开始。」' },
            { l: '把名片收好', r: '「收好。那是底稿。唯一的。」' }
        ]}
    ];

    const EGG = {
        id: 'line',
        name: '一张光暗分界线的照片',
        story: '剧院出口，他站在光与暗的分界线上，转过身，跨了半步。照片背面写着：“黑暗以外的地方，你会带着我吗？”',
        opts: [
            { l: '握住那半步', r: '「……好。这次，我跟你走。」' },
            { l: '问他为什么不跨完', r: '「因为另外半步，得你带着我。」' }
        ]
    };

    let privState = {};
    PRIV.forEach(p => privState[p.id] = { open: false, chosen: null });
    let privOpened = false, eggUnlocked = false;

    function renderPriv() {
        const body = document.getElementById('privBody');
        if (!privOpened) {
            body.innerHTML = `<div class="priv-locked">
                <div class="lock-text">他 没 写 进 账 本 的 东 西</div>
                <button class="gold-btn" id="openPriv">看 看 他 藏 了 什 么</button>
            </div>`;
            document.getElementById('openPriv').onclick = () => {
                privOpened = true;
                renderPriv();
                toast('「这些东西……只对一个人开放过。你确定要看？」');
            };
            return;
        }

        const list = PRIV.slice();
        if (eggUnlocked) list.push(EGG);

        let html = `<div class="priv-note">「确定要看？这些东西，我从来没写进任何账本。」</div>`;
        list.forEach(p => {
            const st = privState[p.id] || (privState[p.id] = { open: false, chosen: null });
            html += `<div class="pitem ${st.open ? 'open' : ''}">
                <button class="pitem-head" data-act="toggle" data-id="${p.id}">
                    <span>${p.name}</span><span>${st.open ? '−' : '+'}</span>
                </button>`;
            if (st.open) {
                html += `<div class="pitem-body">
                    <div class="pstory">${p.story}</div>`;
                if (st.chosen === null) {
                    p.opts.forEach((o, oi) => {
                        html += `<button class="popt" data-act="opt" data-id="${p.id}" data-oi="${oi}">${o.l}</button>`;
                    });
                } else {
                    html += `<div class="pres">${p.opts[st.chosen].r}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        });
        body.innerHTML = html;
    }

    document.getElementById('privBody').onclick = (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const id = t.dataset.id;
        const st = privState[id];
        if (!st) return;

        if (t.dataset.act === 'toggle') {
            st.open = !st.open;
            renderPriv();
        } else if (t.dataset.act === 'opt') {
            st.chosen = parseInt(t.dataset.oi, 10);
            renderPriv();
            checkEgg();
        }
    };

    function checkEgg() {
        if (eggUnlocked) return;
        const allDone = PRIV.every(p => privState[p.id] && privState[p.id].chosen !== null);
        if (!allDone) return;
        eggUnlocked = true;
        setTimeout(() => {
            renderPriv();
            toast('他在账本最底下，压了一张照片。');
        }, 1000);
    }

    /* ================= 彩蛋与反馈 ================= */
    let tapN = 0;
    document.getElementById('totalNum').onclick = () => {
        tapN++;
        const note = document.getElementById('totalNote');
        if (tapN === 5) note.innerText = '账本边角有一行极小的字：“别数了。”';
        else if (tapN === 10) note.innerText = '“再点，我就把你名下那栏划掉。”';
        else if (tapN === 15) note.innerText = '“行。你赢了。想要什么，直接跟我说。……我从不拒绝你。”';
    };

    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 启动验证
    renderGate();

})();
</script>
</body>
</html>
