<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BEE BROS · 姜风桀的落日账本</title>
<style>
    :root {
        --bg-base: #12101a;
        --bg-card: #1a1726;
        --bg-elevated: #221e30;
        --sunset: #e8864a;
        --sunset-bright: #f0a868;
        --dusk: #8a5a7a;
        --plum: #5a3a5a;
        --balloon: #d45a6a;
        --sky: #6a8aaa;
        --text-main: #e8e0ec;
        --text-dim: #9a8ea8;
        --border-dim: #2e2a3e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; background-color: var(--bg-base); color: var(--text-main); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
            radial-gradient(1000px 600px at 50% 120%, rgba(232,134,74,0.12), transparent 70%),
            radial-gradient(800px 500px at 50% -20%, rgba(138,90,122,0.10), transparent 70%),
            radial-gradient(400px 400px at 90% 30%, rgba(212,90,106,0.05), transparent 70%);
    }

    /* ============ 验证入口 ============ */
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .gate-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-dim); padding: 28px 22px; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; }
    .gate-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--sunset), var(--balloon), var(--dusk)); border-radius: 4px 4px 0 0; }
    .gate-box::after { content: 'BEE BROS · 日落之前'; position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: var(--dusk); letter-spacing: 2px; }

    .seal-logo { width: 66px; height: 66px; margin: 0 auto 14px; border: 2px solid var(--sunset); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 24px rgba(232,134,74,0.2); background: var(--bg-elevated); position: relative; }
    .seal-logo::after { content: ''; position: absolute; inset: 5px; border: 1px dashed rgba(232,134,74,0.3); border-radius: 50%; }
    .gate-title { text-align: center; font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 24px; }

    .gq { font-size: 13px; color: var(--sunset); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .gq::before { content: '🎈'; font-size: 14px; }
    .gtext { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }
    .gtext b { color: var(--text-main); font-weight: normal; }

    .gopts { display: flex; flex-direction: column; gap: 9px; }
    .gbtn { background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 12px 15px; text-align: left; border-radius: 4px; transition: all 0.2s; font-size: 14px; line-height: 1.6; color: var(--text-main); }
    .gbtn:active { background: rgba(232,134,74,0.1); border-color: var(--sunset); color: var(--sunset-bright); }

    .gnote { margin-top: 14px; font-size: 12px; color: var(--balloon); line-height: 1.85; min-height: 20px; }

    .handwrite { font-size: 15px; color: var(--sunset-bright); line-height: 2; padding: 16px; border-left: 3px solid var(--balloon); background: rgba(212,90,106,0.06); border-radius: 0 4px 4px 0; margin: 18px 0; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; }
    .handwrite.show { opacity: 1; transform: none; }

    .stamp { display: inline-block; border: 2px solid var(--sky); color: var(--sky); padding: 6px 16px; font-size: 13px; font-weight: bold; letter-spacing: 2px; border-radius: 4px; margin-bottom: 18px; opacity: 0; transform: rotate(-2deg); }
    .stamp.show { opacity: 1; animation: stampIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes stampIn { 0% { transform: rotate(-10deg) scale(2); opacity: 0; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }

    .enter-btn { width: 100%; background: linear-gradient(135deg, var(--balloon), var(--sunset)); border: none; color: #fff; padding: 12px; font-size: 15px; font-weight: bold; letter-spacing: 4px; border-radius: 4px; margin-top: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .enter-btn.show { opacity: 1; pointer-events: auto; }
    .enter-btn:active { filter: brightness(0.85); }

    /* ============ 主体 ============ */
    #app { display: none; max-width: 540px; margin: 0 auto; padding: 0 15px 50px; opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: rgba(18,16,26,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-dim); margin-bottom: 15px; }
    .h-left { display: flex; align-items: center; gap: 11px; }
    .h-seal { width: 34px; height: 34px; border: 1.5px solid var(--sunset); color: var(--sunset); display: flex; align-items: center; justify-content: center; font-size: 16px; border-radius: 50%; background: var(--bg-elevated); }
    .h-title { font-size: 14px; color: var(--text-main); letter-spacing: 1px; }
    .h-sub { font-size: 11px; color: var(--balloon); letter-spacing: 0.5px; }
    .pill { border: 1px solid var(--border-dim); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); transition: 0.2s; background: var(--bg-card); }
    .pill.on { border-color: var(--sunset); color: var(--sunset); background: rgba(232,134,74,0.08); }

    .card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 4px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--sunset), var(--balloon), transparent); opacity: 0.6; }
    .card-title { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

    .total-num { font-size: 31px; color: var(--sunset-bright); font-family: Georgia, serif; text-shadow: 0 0 20px rgba(232,134,74,0.25); cursor: pointer; word-break: break-all; transition: text-shadow 0.2s; }
    .total-num:active { text-shadow: 0 0 32px rgba(240,168,104,0.8); }
    .total-meta { font-size: 12px; color: var(--balloon); margin-top: 5px; }
    .total-note { font-size: 12px; color: var(--sky); margin-top: 10px; min-height: 18px; line-height: 1.7; }

    .chart-row { margin-bottom: 10px; }
    .chart-row:last-child { margin-bottom: 0; }
    .chart-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .chart-val { color: var(--sunset-bright); font-family: Georgia, serif; }
    .chart-track { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }
    .chart-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--plum), var(--dusk), var(--sunset)); transition: width 0.1s linear; border-radius: 3px; }

    .asset-cat { margin-bottom: 4px; }
    .cat-head { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-dim); color: var(--sunset); font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .cat-val { color: var(--sunset-bright); font-family: Georgia, serif; font-weight: normal; }
    .asset-item { padding: 10px 0; border-bottom: 1px dashed var(--border-dim); }
    .asset-item:last-child { border-bottom: none; }
    .ai-top { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
    .ai-top span:first-child { flex: 1; }
    .ai-val { color: var(--sunset-bright); font-family: Georgia, serif; white-space: nowrap; }
    .ai-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }

    /* 私密空间 */
    .priv-locked { text-align: center; padding: 15px 0; }
    .lock-text { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 2px; }
    .gold-btn { border: 1.5px solid var(--sunset); color: var(--sunset); padding: 8px 24px; border-radius: 4px; font-size: 13px; letter-spacing: 2px; transition: 0.2s; background: var(--bg-card); }
    .gold-btn:active { background: rgba(232,134,74,0.1); }

    .priv-note { font-size: 12px; color: var(--text-dim); padding-bottom: 10px; border-bottom: 1px dashed var(--border-dim); margin-bottom: 10px; line-height: 1.7; }
    .pitem { border-bottom: 1px dashed var(--border-dim); }
    .pitem:last-child { border-bottom: none; }
    .pitem-head { width: 100%; text-align: left; padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; transition: color 0.2s; gap: 10px; }
    .pitem-head span:first-child { flex: 1; }
    .pitem-head:active { color: var(--sunset); }
    .pitem-head::before { content: '🎈'; margin-right: 8px; font-size: 12px; }
    .pitem-body { padding-bottom: 15px; display: none; }
    .pitem.open .pitem-body { display: block; animation: fadeIn 0.3s ease; }
    .pstory { font-size: 13px; color: var(--text-main); line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--balloon); margin-bottom: 12px; }
    .popt { display: block; width: 100%; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 4px; transition: 0.2s; line-height: 1.6; }
    .popt:active { border-color: var(--sunset); color: var(--sunset-bright); }
    .pres { font-size: 13px; color: var(--sunset-bright); padding: 11px 12px; border: 1px solid rgba(232,134,74,0.3); background: rgba(232,134,74,0.05); border-radius: 4px; animation: fadeIn 0.3s ease; line-height: 1.75; }

    /* 消息浮层 */
    #msg-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; pointer-events: none; display: none; }
    .msg-card { background: var(--bg-elevated); border: 1.5px solid var(--sunset); border-radius: 4px; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.85); pointer-events: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.1) both; max-width: 540px; margin: 0 auto; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg-from { font-size: 11px; color: var(--sunset); margin-bottom: 6px; letter-spacing: 2px; }
    .msg-text { font-size: 14px; color: var(--text-main); margin-bottom: 12px; padding-right: 20px; line-height: 1.75; }
    .msg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg-btn { background: var(--bg-base); border: 1px solid var(--border-dim); padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-radius: 4px; transition: 0.2s; }
    .msg-btn:active { border-color: var(--sunset); color: var(--sunset-bright); }
    .msg-x { position: absolute; top: 10px; right: 10px; font-size: 18px; color: var(--text-dim); padding: 5px; transition: color 0.2s; }
    .msg-x:active { color: var(--sunset); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-elevated); border: 1px solid var(--sunset); color: var(--sunset-bright); padding: 9px 16px; border-radius: 4px; font-size: 13px; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; max-width: 90vw; line-height: 1.6; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- 验证入口 -->
<div id="gate">
    <div class="gate-box">
        <div class="seal-logo">🎈</div>
        <div class="gate-title">B E E B R O S · 姜 风 桀 的 落 日 账 本</div>
        <div id="gateStep"></div>
        <div class="gnote" style="text-align: center; margin-top: 18px;">日落之前，他还在等你</div>
    </div>
</div>

<!-- 主体 -->
<div id="app">
    <div class="header">
        <div class="h-left">
            <div class="h-seal">🎈</div>
            <div>
                <div class="h-title">姜风桀的落日账本</div>
                <div class="h-sub" id="permLabel">权限：握住气球线的人</div>
            </div>
        </div>
        <button class="pill" id="pauseBtn">暂停消息</button>
    </div>

    <div class="card">
        <div class="card-title">全部家当</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-meta" id="rateInfo">每秒进项 +0</div>
        <div class="total-note" id="totalNote"></div>
    </div>

    <div class="card">
        <div class="card-title">家当配比</div>
        <div id="chart"></div>
    </div>

    <div class="card">
        <div class="card-title">明细</div>
        <div id="assetList"></div>
    </div>

    <div class="card">
        <div class="card-title">他没说出口的东西</div>
        <div id="privBody"></div>
    </div>
</div>

<!-- 消息浮层 -->
<div id="msg-wrap">
    <div class="msg-card">
        <button class="msg-x" id="msgX">×</button>
        <div class="msg-from">姜 风 桀</div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-opts" id="msgOpts"></div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    const fmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    /* ================= 数据配置 ================= */
    const DATA = [
        {
            cat: 'BEE BROS · 狙击委托',
            short: '狙击委托',
            items: [
                { n: '未结清的雇佣兵余款', b: 240000, r: 15, note: '很多任务指定要我。但我从不固定服务谁，也经常“消失”。' },
                { n: '“指定狙击”溢价', b: 86000, r: 8, note: '心理素质过硬，技术够强。报价自然也不低。' },
                { n: '千城会议后拒接的委托定金', b: 0, r: 0, note: '不接了。战争开始，父亲也不知所踪。' }
            ]
        },
        {
            cat: '糖果店 · 常客',
            short: '糖果店',
            items: [
                { n: '糖果店会员积分', b: 3200, r: 1, note: '想找我去糖果店，比去战场快。' },
                { n: '和小孩换糖的小兔子库存', b: 480, r: 1, note: '粉色小兔子换糖。很公平的交易。' }
            ]
        },
        {
            cat: '姜风桀 · 个人持有',
            short: '个人持有',
            items: [
                { n: '红色夹克（备件）', b: 6800, r: 0, note: '执行任务也穿这件。有人说我太自信，有人说我太蠢。' },
                { n: '攒着没送出去的气球', b: 1200, r: 1, note: '彩色的，在风里，无拘无束。和日落很像。' },
                { n: '狙击枪维护费', b: 4500, r: 2, note: '瞄准镜里从来不是你。……真的。' }
            ]
        },
        {
            cat: '我们 · 抓紧的东西',
            short: '抓紧的东西',
            items: [
                { n: '一根气球线', b: 0, r: 0, note: '握住。抓紧了。这些就都是你的，不止气球。' }
            ]
        }
    ];

    let T0 = 0;
    let updateTimer = null;

    /* ================= 入口验证 ================= */
    let gateStep = 0;
    const gateEl = document.getElementById('gateStep');

    function renderGate() {
        if (gateStep === 0) {
            gateEl.innerHTML = `
                <div class="gq">壹 · 来者何人</div>
                <div class="gtext">这是姜风桀的账本。他正站在落日里，手里攥着一把气球线。<br><b>你想抓住什么？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="run">抓 住 逃 跑 的 机 会</button>
                    <button class="gbtn" data-v="snipe">抓 住 狙 击 的 目 标</button>
                    <button class="gbtn" data-v="hold">抓 住 那 根 气 球 线</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'hold') {
                        document.getElementById('gNote').innerText = "他低头看了看手里的线，然后递过来一根。\n「握住了。别松。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2400);
                    } else if (btn.dataset.v === 'snipe') {
                        document.getElementById('gNote').innerText = "「目标？瞄准镜里可不是你。……算了，先回答我一题。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    } else {
                        document.getElementById('gNote').innerText = "「逃跑啊。我喜欢逃跑。……不过今天，我还没走。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 1) {
            gateEl.innerHTML = `
                <div class="gq">贰 · 小小测试</div>
                <div class="gtext">姜风桀说，日出没意思，他更喜欢日落。<br><b>你觉得为什么？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="a">因为日落更好看</button>
                    <button class="gbtn" data-v="b">因为日出是来光临的，日落是来逃跑的</button>
                    <button class="gbtn" data-v="c">因为大张旗鼓逃跑的人，其实更想被留下</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'c') {
                        gateStep = 2; renderGate();
                    } else if (btn.dataset.v === 'b') {
                        document.getElementById('gNote').innerText = "「……你记得挺清楚。那后半句呢？」";
                        setTimeout(() => { gateStep = 2; renderGate(); }, 1800);
                    } else {
                        document.getElementById('gNote').innerText = "「好看是好看。不过，不止好看。」";
                        setTimeout(() => { gateStep = 2; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 2) {
            gateEl.innerHTML = `
                <div class="gq">叁 · 确认</div>
                <div class="gtext">账本里有狙击委托、糖果积分、没送出去的气球。<br><b>你确定要看吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="yes">看 吧，我 不 会 跑</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelector('.gbtn').onclick = () => {
                document.getElementById('gNote').innerText = "「那我也不跑了。今天日落之前，账本归你。」";
                setTimeout(() => { gateStep = 3; renderGate(); }, 1600);
            };
        } else {
            gateEl.innerHTML = `
                <div class="gq">肆 · 姜风桀的话</div>
                <div class="handwrite" id="hw">「我跟日落更像一点儿。<br>你看这彩色的气球也一样，<br>在风里，无拘无束。<br><br>不过吧，<br>大张旗鼓逃跑的家伙，<br>其实更想被困住和留下。<br><br>所以你得握住，抓紧了。<br>这些就都是你的，<br>不止气球……」</div>
                <div id="stampBox"></div>
            `;
            setTimeout(() => { document.getElementById('hw').classList.add('show'); }, 500);
            setTimeout(() => {
                document.getElementById('stampBox').innerHTML = `
                    <div class="stamp show">认证：被抓住的人</div>
                    <button class="enter-btn show" id="enterBtn">翻 开 账 本</button>
                `;
                document.getElementById('enterBtn').onclick = enterApp;
            }, 3200);
        }
    }

    /* ================= 进入主体 ================= */
    function enterApp() {
        document.getElementById('gate').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = 'block';
        setTimeout(() => app.classList.add('show'), 50);

        T0 = performance.now();
        buildAssets();
        buildChart();
        updateAll();

        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(updateAll, 100);

        scheduleMsg(7000);
    }

    /* ================= 资产系统 ================= */
    function buildAssets() {
        const wrap = document.getElementById('assetList');
        let html = '';
        DATA.forEach((c, ci) => {
            html += `<div class="asset-cat">
                <div class="cat-head"><span>${c.cat}</span><span class="cat-val" id="c_${ci}">—</span></div>`;
            c.items.forEach((it, ii) => {
                html += `<div class="asset-item">
                    <div class="ai-top"><span>${it.n}</span><span class="ai-val" id="v_${ci}_${ii}">—</span></div>
                    <div class="ai-note">${it.note}</div>
                </div>`;
            });
            html += '</div>';
        });
        wrap.innerHTML = html;
    }

    function buildChart() {
        const el = document.getElementById('chart');
        let html = '';
        DATA.forEach((c, i) => {
            html += `<div class="chart-row">
                <div class="chart-top"><span>${c.short}</span><span class="chart-val" id="chv_${i}">—</span></div>
                <div class="chart-track"><div class="chart-fill" id="bar_${i}"></div></div>
            </div>`;
        });
        el.innerHTML = html;

        let rate = 0;
        DATA.forEach(c => c.items.forEach(it => rate += it.r));
        document.getElementById('rateInfo').innerText = `每秒进项 +${fmt(rate)}`;
    }

    function updateAll() {
        const e = (performance.now() - T0) / 1000;
        let catVals = [];
        let total = 0;

        DATA.forEach((c, ci) => {
            let s = 0;
            c.items.forEach((it, ii) => {
                let v = it.b + it.r * e;
                s += v;
                const node = document.getElementById(`v_${ci}_${ii}`);
                if (node) {
                    if (it.b === 0 && it.r === 0) {
                        node.innerText = it.note.includes('不止气球') ? '不止气球' : '未结清';
                    } else {
                        node.innerText = fmt(v);
                    }
                }
            });
            catVals.push(s);
            total += s;
            const cn = document.getElementById(`c_${ci}`);
            if (cn) cn.innerText = (s === 0) ? '—' : fmt(s);
        });

        document.getElementById('totalNum').innerText = fmt(total);

        const max = Math.max(...catVals, 1);
        catVals.forEach((v, i) => {
            const bar = document.getElementById(`bar_${i}`);
            if (bar) bar.style.width = (v <= 0 ? 0 : Math.max(1, (v / max) * 100)) + '%';
            const cv = document.getElementById(`chv_${i}`);
            if (cv) cv.innerText = (v <= 0) ? '无价' : fmt(v);
        });
    }

    /* ================= 消息系统 ================= */
    const MSGS = [
        { t: '账本看到糖果店那栏了吧。想找我去战场可能扑空，去糖果店反而一找一个准。', o: [
            { l: '所以你爱吃糖', r: '「爱吃。但更多是拿去跟小孩换小兔子。粉色那种。」' },
            { l: '那我也去糖果店找你', r: '「……那你可要抓紧了。我跑得挺快的。不过你来了，我就不跑。」' }
        ]},
        { t: '红夹克备件那栏，是不是有点好笑。执行任务也穿红的，别人说我不是太自信就是太蠢。', o: [
            { l: '我觉得挺好看', r: '「是吧！我也觉得。而且显眼。瞄准镜里找起来方便。」' },
            { l: '那你为什么还穿', r: '「因为……算了。可能是因为想让某个人一眼就认出来。」' }
        ]},
        { t: '我父亲是退伍军人。档案丢了，人也不见了。所以我回到007城，不接委托了。', o: [
            { l: '你还在找他吗', r: '「找。但我也知道，可能找不到了。……所以更得把眼前的人抓住。」' },
            { l: '我陪你找', r: '「……别。你陪着我就行。找人的事，我自己来。」' }
        ]},
        { t: '那种心跳频率，你还让我怎么成为厉害的雇佣兵。……说的就是你。别装不知道。', o: [
            { l: '那我不碰你了', r: '「别。我不是那个意思。……我是说，你可以碰。」' },
            { l: '厉害雇佣兵也会心跳乱', r: '「只在你面前乱。瞄准镜里可从来不会。」' }
        ]}
    ];

    let msgIdx = 0, msgTimer = null, msgOpen = false, msgPaused = false;

    function scheduleMsg(delay) {
        clearTimeout(msgTimer);
        if (msgPaused) return;
        msgTimer = setTimeout(() => {
            if (msgPaused || msgOpen) return;
            showMsg();
        }, delay || 15000);
    }

    function showMsg() {
        const m = MSGS[msgIdx % MSGS.length];
        msgIdx++;
        msgOpen = true;
        document.getElementById('msgText').innerText = m.t;
        const opts = document.getElementById('msgOpts');
        opts.innerHTML = '';

        m.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'msg-btn';
            b.innerText = o.l;
            b.onclick = () => {
                opts.innerHTML = `<div class="pres">${o.r}</div>`;
                setTimeout(closeMsg, 3200);
            };
            opts.appendChild(b);
        });

        document.getElementById('msg-wrap').style.display = 'block';
    }

    function closeMsg() {
        const scrollPos = window.scrollY;
        document.getElementById('msg-wrap').style.display = 'none';
        msgOpen = false;
        window.scrollTo(0, scrollPos);
        scheduleMsg(15000);
    }

    document.getElementById('msgX').onclick = closeMsg;

    document.getElementById('pauseBtn').onclick = function() {
        msgPaused = !msgPaused;
        this.innerText = msgPaused ? '恢复消息' : '暂停消息';
        this.classList.toggle('on', msgPaused);
        if (msgPaused) clearTimeout(msgTimer);
        else if (!msgOpen) scheduleMsg(3000);
    };

    /* ================= 他没说出口的东西 ================= */
    const PRIV = [
        { id: 'rabbit', name: '一张粉色小兔子的糖果纸', story: '小孩拿小兔子跟他换糖吃。糖给出去了，兔子纸他留下了，压得平平整整。', opts: [
            { l: '问他为什么留', r: '「因为那小孩说，小兔子能带来好运。我信了。」' },
            { l: '笑他信这个', r: '「怎么不能信。你看，你这不是来了吗。」' }
        ]},
        { id: 'jacket', name: '红夹克口袋里的糖', story: '每次出任务前，他都会往口袋里塞一颗。从来没吃过。', opts: [
            { l: '问他为什么不吃', r: '「留着。万一遇到需要糖的人呢。」' },
            { l: '那现在给我一颗', r: '「……给。这颗塞了很久了，可能有点化了。但甜还是甜的。」' }
        ]},
        { id: 'photo', name: '一张父亲留下的模糊照片', story: '照片里只有一个背影，穿着旧军装。背面没有字。', opts: [
            { l: '问他父亲什么样', r: '「记不太清了。只记得他走路很直。……我走路也直，大概随他。」' },
            { l: '安静地还给他', r: '「谢谢。这照片我很少给人看。」' }
        ]},
        { id: 'receipt', name: '一张“消失”时去糖果店的收据', story: '某次任务间隙，他消失了三天。收据上是一大袋彩色糖，和一只粉色小兔子。', opts: [
            { l: '问他消失那三天做了什么', r: '「……买了糖。坐在店门口，看小孩换小兔子。」' },
            { l: '一个人吗', r: '「一个人。不过那天我就在想，要是有人陪着就好了。」' }
        ]}
    ];

    const EGG = {
        id: 'balloon',
        name: '一根系着气球线的绳子',
        story: '绳子末端缠着一张小纸条：“握住。抓紧了。这些就都是你的，不止气球。——还有我。”',
        opts: [
            { l: '握紧绳子', r: '「好。现在它们都是你的了。我也一样。」' },
            { l: '问他会不会跑', r: '「不跑了。被你抓住的人，跑什么。」' }
        ]
    };

    let privState = {};
    PRIV.forEach(p => privState[p.id] = { open: false, chosen: null });
    let privOpened = false, eggUnlocked = false;

    function renderPriv() {
        const body = document.getElementById('privBody');
        if (!privOpened) {
            body.innerHTML = `<div class="priv-locked">
                <div class="lock-text">他 没 说 出 口 的 东 西</div>
                <button class="gold-btn" id="openPriv">看 看 他 藏 了 什 么</button>
            </div>`;
            document.getElementById('openPriv').onclick = () => {
                privOpened = true;
                renderPriv();
                toast('「这些东西……我本来打算带着跑的。现在不跑了，就给你看吧。」');
            };
            return;
        }

        const list = PRIV.slice();
        if (eggUnlocked) list.push(EGG);

        let html = `<div class="priv-note">「都是些小东西。有些是纪念，有些……是想着你的时候留下的。」</div>`;
        list.forEach(p => {
            const st = privState[p.id] || (privState[p.id] = { open: false, chosen: null });
            html += `<div class="pitem ${st.open ? 'open' : ''}">
                <button class="pitem-head" data-act="toggle" data-id="${p.id}">
                    <span>${p.name}</span><span>${st.open ? '−' : '+'}</span>
                </button>`;
            if (st.open) {
                html += `<div class="pitem-body">
                    <div class="pstory">${p.story}</div>`;
                if (st.chosen === null) {
                    p.opts.forEach((o, oi) => {
                        html += `<button class="popt" data-act="opt" data-id="${p.id}" data-oi="${oi}">${o.l}</button>`;
                    });
                } else {
                    html += `<div class="pres">${p.opts[st.chosen].r}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        });
        body.innerHTML = html;
    }

    document.getElementById('privBody').onclick = (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const id = t.dataset.id;
        const st = privState[id];
        if (!st) return;

        if (t.dataset.act === 'toggle') {
            st.open = !st.open;
            renderPriv();
        } else if (t.dataset.act === 'opt') {
            st.chosen = parseInt(t.dataset.oi, 10);
            renderPriv();
            checkEgg();
        }
    };

    function checkEgg() {
        if (eggUnlocked) return;
        const allDone = PRIV.every(p => privState[p.id] && privState[p.id].chosen !== null);
        if (!allDone) return;
        eggUnlocked = true;
        setTimeout(() => {
            renderPriv();
            toast('他把手里那根气球线，递了过来。');
        }, 1000);
    }

    /* ================= 彩蛋与反馈 ================= */
    let tapN = 0;
    document.getElementById('totalNum').onclick = () => {
        tapN++;
        const note = document.getElementById('totalNote');
        if (tapN === 5) note.innerText = '账本边角画了一个气球。线很长，一直画到纸外面。';
        else if (tapN === 10) note.innerText = '“再点，我就当你是在数我口袋里的糖。”';
        else if (tapN === 15) note.innerText = '“行吧。糖都给你。气球也给你。……我也给你。”';
    };

    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 启动验证
    renderGate();

})();
</script>
</body>
</html>
