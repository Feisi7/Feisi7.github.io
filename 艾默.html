<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>G-HOST · 艾默的作品账本</title>
<style>
    :root {
        --bg-base: #0e0f13;
        --bg-card: #15171d;
        --bg-elevated: #1c1f27;
        --moon: #c8ccd8;
        --moon-bright: #e8ecf4;
        --mist: #8a90a0;
        --warm: #c8a07a;
        --warm-bright: #e8c8a0;
        --paint: #a86a5a;
        --text-main: #dce0e8;
        --text-dim: #7a8090;
        --border-dim: #242830;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; background-color: var(--bg-base); color: var(--text-main); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
            radial-gradient(900px 600px at 50% -10%, rgba(200,204,216,0.06), transparent 70%),
            radial-gradient(700px 500px at 110% 105%, rgba(200,160,122,0.05), transparent 70%);
    }

    /* ============ 验证入口 ============ */
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .gate-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-dim); padding: 28px 22px; border-radius: 2px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; }
    .gate-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--moon), var(--warm), transparent); }
    .gate-box::after { content: 'G-HOST · 作品存档'; position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: var(--mist); letter-spacing: 2px; }

    .seal-logo { width: 66px; height: 66px; margin: 0 auto 14px; border: 1.5px solid var(--moon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 0 24px rgba(200,204,216,0.12); background: var(--bg-elevated); position: relative; overflow: hidden; }
    .seal-logo::after { content: ''; position: absolute; inset: 4px; border: 1px dashed rgba(200,204,216,0.2); border-radius: 50%; }
    .seal-logo span { color: var(--moon-bright); font-family: Georgia, serif; }
    .gate-title { text-align: center; font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 24px; }

    .gq { font-size: 13px; color: var(--moon); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .gq::before { content: '☾'; font-size: 15px; color: var(--warm); }
    .gtext { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }
    .gtext b { color: var(--text-main); font-weight: normal; }

    .gopts { display: flex; flex-direction: column; gap: 9px; }
    .gbtn { background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 12px 15px; text-align: left; border-radius: 2px; transition: all 0.2s; font-size: 14px; line-height: 1.6; color: var(--text-main); }
    .gbtn:active { background: rgba(200,204,216,0.08); border-color: var(--moon); color: var(--moon-bright); }

    .gnote { margin-top: 14px; font-size: 12px; color: var(--warm); line-height: 1.85; min-height: 20px; }

    .handwrite { font-size: 15px; color: var(--warm-bright); line-height: 2; padding: 16px; border-left: 2px solid var(--warm); background: rgba(200,160,122,0.04); margin: 18px 0; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; }
    .handwrite.show { opacity: 1; transform: none; }

    .stamp { display: inline-block; border: 2px solid var(--paint); color: var(--paint); padding: 5px 15px; font-size: 13px; font-weight: bold; letter-spacing: 2px; transform: rotate(-2deg); margin-bottom: 18px; opacity: 0; }
    .stamp.show { opacity: 1; animation: stampIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes stampIn { 0% { transform: rotate(-10deg) scale(2); opacity: 0; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }

    .enter-btn { width: 100%; background: transparent; border: 1px solid var(--moon); color: var(--moon); padding: 12px; font-size: 15px; letter-spacing: 5px; border-radius: 2px; margin-top: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .enter-btn.show { opacity: 1; pointer-events: auto; }
    .enter-btn:active { background: rgba(200,204,216,0.1); }

    /* ============ 主体 ============ */
    #app { display: none; max-width: 540px; margin: 0 auto; padding: 0 15px 50px; opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: rgba(14,15,19,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-dim); margin-bottom: 15px; }
    .h-left { display: flex; align-items: center; gap: 11px; }
    .h-seal { width: 34px; height: 34px; border: 1px solid var(--moon); color: var(--moon); display: flex; align-items: center; justify-content: center; font-size: 16px; border-radius: 50%; background: var(--bg-elevated); }
    .h-title { font-size: 14px; color: var(--text-main); letter-spacing: 1px; }
    .h-sub { font-size: 11px; color: var(--warm); letter-spacing: 0.5px; }
    .pill { border: 1px solid var(--border-dim); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); transition: 0.2s; background: var(--bg-card); }
    .pill.on { border-color: var(--moon); color: var(--moon); background: rgba(200,204,216,0.08); }

    .card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 2px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--moon), var(--warm), transparent); opacity: 0.4; }
    .card-title { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

    .total-num { font-size: 31px; color: var(--moon-bright); font-family: Georgia, serif; text-shadow: 0 0 20px rgba(200,204,216,0.15); cursor: pointer; word-break: break-all; transition: text-shadow 0.2s; }
    .total-num:active { text-shadow: 0 0 32px rgba(232,236,244,0.6); }
    .total-meta { font-size: 12px; color: var(--warm); margin-top: 5px; }
    .total-note { font-size: 12px; color: var(--paint); margin-top: 10px; min-height: 18px; line-height: 1.7; }

    .chart-row { margin-bottom: 10px; }
    .chart-row:last-child { margin-bottom: 0; }
    .chart-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .chart-val { color: var(--moon-bright); font-family: Georgia, serif; }
    .chart-track { height: 5px; background: var(--bg-elevated); border-radius: 1px; overflow: hidden; }
    .chart-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--mist), var(--moon)); transition: width 0.1s linear; }

    .asset-cat { margin-bottom: 4px; }
    .cat-head { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-dim); color: var(--moon); font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .cat-val { color: var(--moon-bright); font-family: Georgia, serif; font-weight: normal; }
    .asset-item { padding: 10px 0; border-bottom: 1px dashed var(--border-dim); }
    .asset-item:last-child { border-bottom: none; }
    .ai-top { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
    .ai-top span:first-child { flex: 1; }
    .ai-val { color: var(--moon-bright); font-family: Georgia, serif; white-space: nowrap; }
    .ai-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }

    /* 私密空间 */
    .priv-locked { text-align: center; padding: 15px 0; }
    .lock-text { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 2px; }
    .gold-btn { border: 1px solid var(--moon); color: var(--moon); padding: 8px 24px; border-radius: 2px; font-size: 13px; letter-spacing: 2px; transition: 0.2s; background: var(--bg-card); }
    .gold-btn:active { background: rgba(200,204,216,0.1); }

    .priv-note { font-size: 12px; color: var(--text-dim); padding-bottom: 10px; border-bottom: 1px dashed var(--border-dim); margin-bottom: 10px; line-height: 1.7; }
    .pitem { border-bottom: 1px dashed var(--border-dim); }
    .pitem:last-child { border-bottom: none; }
    .pitem-head { width: 100%; text-align: left; padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; transition: color 0.2s; gap: 10px; }
    .pitem-head span:first-child { flex: 1; }
    .pitem-head:active { color: var(--moon); }
    .pitem-head::before { content: '☾'; margin-right: 8px; font-size: 13px; color: var(--warm); }
    .pitem-body { padding-bottom: 15px; display: none; }
    .pitem.open .pitem-body { display: block; animation: fadeIn 0.3s ease; }
    .pstory { font-size: 13px; color: var(--text-main); line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--warm); margin-bottom: 12px; }
    .popt { display: block; width: 100%; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 2px; transition: 0.2s; line-height: 1.6; }
    .popt:active { border-color: var(--moon); color: var(--moon-bright); }
    .pres { font-size: 13px; color: var(--warm-bright); padding: 11px 12px; border: 1px solid rgba(200,160,122,0.3); background: rgba(200,160,122,0.04); border-radius: 2px; animation: fadeIn 0.3s ease; line-height: 1.75; }

    /* 消息浮层 */
    #msg-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; pointer-events: none; display: none; }
    .msg-card { background: var(--bg-elevated); border: 1px solid var(--moon); border-radius: 2px; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.85); pointer-events: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.1) both; max-width: 540px; margin: 0 auto; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg-from { font-size: 11px; color: var(--moon); margin-bottom: 6px; letter-spacing: 2px; }
    .msg-text { font-size: 14px; color: var(--text-main); margin-bottom: 12px; padding-right: 20px; line-height: 1.75; }
    .msg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg-btn { background: var(--bg-base); border: 1px solid var(--border-dim); padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-radius: 2px; transition: 0.2s; }
    .msg-btn:active { border-color: var(--moon); color: var(--moon-bright); }
    .msg-x { position: absolute; top: 10px; right: 10px; font-size: 18px; color: var(--text-dim); padding: 5px; transition: color 0.2s; }
    .msg-x:active { color: var(--moon); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-elevated); border: 1px solid var(--moon); color: var(--moon-bright); padding: 9px 16px; border-radius: 2px; font-size: 13px; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; max-width: 90vw; line-height: 1.6; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- 验证入口 -->
<div id="gate">
    <div class="gate-box">
        <div class="seal-logo"><span>E</span></div>
        <div class="gate-title">G - H O S T · 艾 默 的 作 品 账 本</div>
        <div id="gateStep"></div>
        <div class="gnote" style="text-align: center; margin-top: 18px;">月光最完美的一吻</div>
    </div>
</div>

<!-- 主体 -->
<div id="app">
    <div class="header">
        <div class="h-left">
            <div class="h-seal">☾</div>
            <div>
                <div class="h-title">艾默的作品账本</div>
                <div class="h-sub" id="permLabel">权限：留下颜料印的人</div>
            </div>
        </div>
        <button class="pill" id="pauseBtn">暂停消息</button>
    </div>

    <div class="card">
        <div class="card-title">全部作品</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-meta" id="rateInfo">每秒进项 +0</div>
        <div class="total-note" id="totalNote"></div>
    </div>

    <div class="card">
        <div class="card-title">作品配比</div>
        <div id="chart"></div>
    </div>

    <div class="card">
        <div class="card-title">明细</div>
        <div id="assetList"></div>
    </div>

    <div class="card">
        <div class="card-title">不在账本上的东西</div>
        <div id="privBody"></div>
    </div>
</div>

<!-- 消息浮层 -->
<div id="msg-wrap">
    <div class="msg-card">
        <button class="msg-x" id="msgX">×</button>
        <div class="msg-from">艾 默</div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-opts" id="msgOpts"></div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    const fmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    /* ================= 数据配置 ================= */
    const DATA = [
        {
            cat: '面具 · 拍卖作品',
            short: '拍卖作品',
            items: [
                { n: '面具作品拍卖存底', b: 86000000, r: 2800, note: '月光最完美的一吻。全部送入拍卖行竞价出售。' },
                { n: '顶级面具雕刻师声誉估值', b: 42000000, r: 1200, note: '二十岁，公认最顶级。没有争议。' }
            ]
        },
        {
            cat: '容颜雕琢 · 定制委托',
            short: '定制委托',
            items: [
                { n: '长期妆容维护委托金', b: 18600000, r: 2200, note: '仿佛真的带上了不必摘下的面具。' },
                { n: '面容还原定制费', b: 9800000, r: 800, note: '在真实面孔上还原作品。每一张脸，都是唯一的。' }
            ]
        },
        {
            cat: '艾默 · 日常采购',
            short: '日常采购',
            items: [
                { n: '鸡蛋', b: 240, r: 0, note: '采购清单上出现频率最高的物品之一。' },
                { n: '牛肉', b: 680, r: 0, note: '和面具放在同一张清单上，有点不搭。' },
                { n: '罗勒', b: 120, r: 0, note: '新鲜的。他挑得很仔细。' },
                { n: '洋葱', b: 80, r: 0, note: '切的时候会流眼泪。他不在意这个。' },
                { n: '芝士（划掉又写上）', b: 320, r: 1, note: '划掉过一次，又写上了。大概是想吃。' }
            ]
        },
        {
            cat: '你 · 手心弯月',
            short: '手心弯月',
            items: [
                { n: '洗不掉的颜料印', b: 0, r: 0, note: '这是一件其他人不能触碰的……由你来完成的作品。' }
            ]
        }
    ];

    let T0 = 0;
    let updateTimer = null;

    /* ================= 入口验证 ================= */
    let gateStep = 0;
    const gateEl = document.getElementById('gateStep');

    function renderGate() {
        if (gateStep === 0) {
            gateEl.innerHTML = `
                <div class="gq">壹 · 身份声明</div>
                <div class="gtext">这是艾默的作品账本。工作室整齐得让人不敢打扰。<br><b>你以什么身份站在这里？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="buyer">拍 卖 行 的 买 家</button>
                    <button class="gbtn" data-v="client">定 制 妆 容 的 客 人</button>
                    <button class="gbtn" data-v="muse">留 下 颜 料 印 的 人</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'muse') {
                        document.getElementById('gNote').innerText = "工作室里安静了很久。然后他低下头，看了看自己的手心。\n「……你来了。手心那块颜料，我一直没洗。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2600);
                    } else if (btn.dataset.v === 'client') {
                        document.getElementById('gNote').innerText = "「定制妆容？可以。但我的作品，不轻易给人碰。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    } else {
                        document.getElementById('gNote').innerText = "「买家。嗯。拍卖行里那些，都是过去的东西了。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 1) {
            gateEl.innerHTML = `
                <div class="gq">贰 · 作品校验</div>
                <div class="gtext">有人说，他的面具是“月光最完美的一吻”。<br><b>但他真正珍惜的作品，是哪一个？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="a">拍卖行里最贵的那件</button>
                    <button class="gbtn" data-v="b">工作室里最整齐的那排</button>
                    <button class="gbtn" data-v="c">你在他手心留下的那块颜料印</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'c') {
                        gateStep = 2; renderGate();
                    } else {
                        document.getElementById('gNote').innerText = "「那些是作品。但不是我最珍惜的。」";
                    }
                };
            });
        } else if (gateStep === 2) {
            gateEl.innerHTML = `
                <div class="gq">叁 · 确认</div>
                <div class="gtext">账本里有拍卖存底、定制委托、鸡蛋牛肉罗勒。<br><b>你确定要看吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="yes">看 吧，我 不 怕 完 美</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelector('.gbtn').onclick = () => {
                document.getElementById('gNote').innerText = "「那进来吧。……别碰那排面具。碰我就好。」";
                setTimeout(() => { gateStep = 3; renderGate(); }, 1600);
            };
        } else {
            gateEl.innerHTML = `
                <div class="gq">肆 · 艾默的话</div>
                <div class="handwrite" id="hw">「不再变成虚伪的容器，<br>你的眼眸是我不屈的动力。<br><br>这是一件其他人不能触碰的……<br>由你来完成的作品。<br><br>——手心那块颜料，<br>我一直留着。<br>洗不掉的。」</div>
                <div id="stampBox"></div>
            `;
            setTimeout(() => { document.getElementById('hw').classList.add('show'); }, 500);
            setTimeout(() => {
                document.getElementById('stampBox').innerHTML = `
                    <div class="stamp show">权限已变更：缪斯</div>
                    <button class="enter-btn show" id="enterBtn">翻 开 账 本</button>
                `;
                document.getElementById('enterBtn').onclick = enterApp;
            }, 3000);
        }
    }

    /* ================= 进入主体 ================= */
    function enterApp() {
        document.getElementById('gate').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = 'block';
        setTimeout(() => app.classList.add('show'), 50);

        T0 = performance.now();
        buildAssets();
        buildChart();
        updateAll();

        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(updateAll, 100);

        scheduleMsg(7000);
    }

    /* ================= 资产系统 ================= */
    function buildAssets() {
        const wrap = document.getElementById('assetList');
        let html = '';
        DATA.forEach((c, ci) => {
            html += `<div class="asset-cat">
                <div class="cat-head"><span>${c.cat}</span><span class="cat-val" id="c_${ci}">—</span></div>`;
            c.items.forEach((it, ii) => {
                html += `<div class="asset-item">
                    <div class="ai-top"><span>${it.n}</span><span class="ai-val" id="v_${ci}_${ii}">—</span></div>
                    <div class="ai-note">${it.note}</div>
                </div>`;
            });
            html += '</div>';
        });
        wrap.innerHTML = html;
    }

    function buildChart() {
        const el = document.getElementById('chart');
        let html = '';
        DATA.forEach((c, i) => {
            html += `<div class="chart-row">
                <div class="chart-top"><span>${c.short}</span><span class="chart-val" id="chv_${i}">—</span></div>
                <div class="chart-track"><div class="chart-fill" id="bar_${i}"></div></div>
            </div>`;
        });
        el.innerHTML = html;

        let rate = 0;
        DATA.forEach(c => c.items.forEach(it => rate += it.r));
        document.getElementById('rateInfo').innerText = `每秒进项 +${fmt(rate)}`;
    }

    function updateAll() {
        const e = (performance.now() - T0) / 1000;
        let catVals = [];
        let total = 0;

        DATA.forEach((c, ci) => {
            let s = 0;
            c.items.forEach((it, ii) => {
                let v = it.b + it.r * e;
                s += v;
                const node = document.getElementById(`v_${ci}_${ii}`);
                if (node) {
                    if (it.b === 0 && it.r === 0) {
                        node.innerText = it.note.includes('其他人不能触碰') ? '由你完成' : '日常';
                    } else {
                        node.innerText = fmt(v);
                    }
                }
            });
            catVals.push(s);
            total += s;
            const cn = document.getElementById(`c_${ci}`);
            if (cn) cn.innerText = (s === 0) ? '—' : fmt(s);
        });

        document.getElementById('totalNum').innerText = fmt(total);

        const max = Math.max(...catVals, 1);
        catVals.forEach((v, i) => {
            const bar = document.getElementById(`bar_${i}`);
            if (bar) bar.style.width = (v <= 0 ? 0 : Math.max(1, (v / max) * 100)) + '%';
            const cv = document.getElementById(`chv_${i}`);
            if (cv) cv.innerText = (v <= 0) ? '无价' : fmt(v);
        });
    }

    /* ================= 消息系统 ================= */
    const MSGS = [
        { t: '看到采购清单那栏了吗。鸡蛋、牛肉、罗勒。是不是和账本很不搭。', o: [
            { l: '你在做饭？', r: '「偶尔。工作室太安静了，做饭的时候……有点声音。」' },
            { l: '芝士为什么划掉又写上', r: '「……因为想吃。但又觉得不该。最后还是写了。」' }
        ]},
        { t: '拍卖行里那些面具，每一件都是完美的。但完美的东西……看久了会冷。', o: [
            { l: '那你为什么还做', r: '「因为以前只会做完美的。现在……想试试不完美的。」' },
            { l: '手心的颜料印不完美', r: '「嗯。所以它是最好的。」' }
        ]},
        { t: '我很少说话。公开场合，能不开口就不开口。但跟你……好像不太一样。', o: [
            { l: '哪里不一样', r: '「不知道。就是想说。哪怕说的都是些没用的话。」' },
            { l: '那多说点', r: '「……好。你想听什么。我慢慢说。」' }
        ]},
        { t: '你那天把颜料弄到我手心里的时候，我本来应该擦掉的。', o: [
            { l: '为什么没擦', r: '「因为那是你弄的。……这个理由够不够。」' },
            { l: '现在擦掉吧', r: '「不擦。这辈子都不擦。」' }
        ]}
    ];

    let msgIdx = 0, msgTimer = null, msgOpen = false, msgPaused = false;

    function scheduleMsg(delay) {
        clearTimeout(msgTimer);
        if (msgPaused) return;
        msgTimer = setTimeout(() => {
            if (msgPaused || msgOpen) return;
            showMsg();
        }, delay || 15000);
    }

    function showMsg() {
        const m = MSGS[msgIdx % MSGS.length];
        msgIdx++;
        msgOpen = true;
        document.getElementById('msgText').innerText = m.t;
        const opts = document.getElementById('msgOpts');
        opts.innerHTML = '';

        m.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'msg-btn';
            b.innerText = o.l;
            b.onclick = () => {
                opts.innerHTML = `<div class="pres">${o.r}</div>`;
                setTimeout(closeMsg, 3200);
            };
            opts.appendChild(b);
        });

        document.getElementById('msg-wrap').style.display = 'block';
    }

    function closeMsg() {
        const scrollPos = window.scrollY;
        document.getElementById('msg-wrap').style.display = 'none';
        msgOpen = false;
        window.scrollTo(0, scrollPos);
        scheduleMsg(15000);
    }

    document.getElementById('msgX').onclick = closeMsg;

    document.getElementById('pauseBtn').onclick = function() {
        msgPaused = !msgPaused;
        this.innerText = msgPaused ? '恢复消息' : '暂停消息';
        this.classList.toggle('on', msgPaused);
        if (msgPaused) clearTimeout(msgTimer);
        else if (!msgOpen) scheduleMsg(3000);
    };

    /* ================= 不在账本上的东西 ================= */
    const PRIV = [
        { id: 'paint', name: '那块洗不掉的颜料痕迹', story: '清凉的水流冲过指尖，指甲边缘的颜料不知何时到了掌心。他低头看了很久，然后没有洗。', opts: [
            { l: '问他为什么留着', r: '「因为这是你完成的。其他人不能碰。」' },
            { l: '说洗掉也没关系', r: '「……不。洗掉就没了。我宁愿一直留着。」' }
        ]},
        { id: 'draft', name: '一张未完成的面具底稿', story: '画到一半就停了。旁边写着一行小字：“这一件，不卖。”', opts: [
            { l: '问他为什么不画完', r: '「因为还没想好。……或者，因为不想画完。画完了就该送走了。」' },
            { l: '说想看他画完', r: '「……那你要在旁边看着。画的时候，我不喜欢一个人。」' }
        ]},
        { id: 'cheese', name: '采购清单上被划掉又写上的“芝士”', story: '划掉过一次，又写上了。字迹比别的都认真。', opts: [
            { l: '问他为什么纠结', r: '「因为觉得不该。但又真的想吃。……别笑。」' },
            { l: '说下次一起去买', r: '「……好。你挑芝士，我挑罗勒。」' }
        ]},
        { id: 'sideface', name: '夕阳余晖里他难得没戴面具的侧脸', story: '没有照片。但你记得。他站在窗前，光从侧面照过来，脸上什么遮盖都没有。', opts: [
            { l: '说那个样子很好看', r: '「……那个样子不好看。太真实了。」' },
            { l: '说想再看一次', r: '「那你以后常来。傍晚的时候。」' }
        ]}
    ];

    const EGG = {
        id: 'palm',
        name: '他摊开的手掌',
        story: '掌心是一块弯月形的颜料印。已经渗进皮肤的纹路里，洗不掉了。他说：“这是一件其他人不能触碰的……由你来完成的作品。”',
        opts: [
            { l: '把手指放上去', r: '「……嗯。这样就完整了。」' },
            { l: '问他会不会后悔', r: '「后悔？我只会后悔没早点遇到你。」' }
        ]
    };

    let privState = {};
    PRIV.forEach(p => privState[p.id] = { open: false, chosen: null });
    let privOpened = false, eggUnlocked = false;

    function renderPriv() {
        const body = document.getElementById('privBody');
        if (!privOpened) {
            body.innerHTML = `<div class="priv-locked">
                <div class="lock-text">不 在 账 本 上 的 东 西</div>
                <button class="gold-btn" id="openPriv">看 看 他 留 了 什 么</button>
            </div>`;
            document.getElementById('openPriv').onclick = () => {
                privOpened = true;
                renderPriv();
                toast('「这些东西……没写进账本。因为不该被标价。」');
            };
            return;
        }

        const list = PRIV.slice();
        if (eggUnlocked) list.push(EGG);

        let html = `<div class="priv-note">「工作室里那些是作品。这些……是别的。」</div>`;
        list.forEach(p => {
            const st = privState[p.id] || (privState[p.id] = { open: false, chosen: null });
            html += `<div class="pitem ${st.open ? 'open' : ''}">
                <button class="pitem-head" data-act="toggle" data-id="${p.id}">
                    <span>${p.name}</span><span>${st.open ? '−' : '+'}</span>
                </button>`;
            if (st.open) {
                html += `<div class="pitem-body">
                    <div class="pstory">${p.story}</div>`;
                if (st.chosen === null) {
                    p.opts.forEach((o, oi) => {
                        html += `<button class="popt" data-act="opt" data-id="${p.id}" data-oi="${oi}">${o.l}</button>`;
                    });
                } else {
                    html += `<div class="pres">${p.opts[st.chosen].r}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        });
        body.innerHTML = html;
    }

    document.getElementById('privBody').onclick = (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const id = t.dataset.id;
        const st = privState[id];
        if (!st) return;

        if (t.dataset.act === 'toggle') {
            st.open = !st.open;
            renderPriv();
        } else if (t.dataset.act === 'opt') {
            st.chosen = parseInt(t.dataset.oi, 10);
            renderPriv();
            checkEgg();
        }
    };

    function checkEgg() {
        if (eggUnlocked) return;
        const allDone = PRIV.every(p => privState[p.id] && privState[p.id].chosen !== null);
        if (!allDone) return;
        eggUnlocked = true;
        setTimeout(() => {
            renderPriv();
            toast('他摊开了手掌。');
        }, 1000);
    }

    /* ================= 彩蛋与反馈 ================= */
    let tapN = 0;
    document.getElementById('totalNum').onclick = () => {
        tapN++;
        const note = document.getElementById('totalNote');
        if (tapN === 5) note.innerText = '账本边角有一小块颜料印。弯月形的。';
        else if (tapN === 10) note.innerText = '“别碰那排面具。……碰我就好。”';
        else if (tapN === 15) note.innerText = '“行。你赢了。手给你。颜料也给你。”';
    };

    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 启动验证
    renderGate();

})();
</script>
</body>
</html>
