<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAN ONWIRE · 沈沉沉的刻名账本</title>
<style>
    :root {
        --bg-base: #0a0c10;
        --bg-card: #12151c;
        --bg-elevated: #1a1e28;
        --water: #4a7a8a;
        --water-bright: #7ab0c0;
        --vermillion: #a83a3a;
        --vermillion-bright: #d46a5a;
        --jade: #6a8a6a;
        --jade-bright: #9ab89a;
        --ink: #e0e4e8;
        --text-main: #d8dce4;
        --text-dim: #7a8290;
        --border-dim: #222830;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: "Songti SC", "STSong", "SimSun", Georgia, serif; background-color: var(--bg-base); color: var(--text-main); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

    body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
            radial-gradient(900px 600px at 50% -10%, rgba(74,122,138,0.08), transparent 70%),
            radial-gradient(700px 500px at 110% 105%, rgba(168,58,58,0.06), transparent 70%);
    }

    /* ============ 验证入口 ============ */
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .gate-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-dim); padding: 28px 22px; border-radius: 2px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; }
    .gate-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--vermillion), var(--water), transparent); }
    .gate-box::after { content: '江天楼 · 刻名存档'; position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: var(--water); letter-spacing: 2px; }

    .seal-logo { width: 66px; height: 66px; margin: 0 auto 14px; border: 1.5px solid var(--vermillion); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 0 24px rgba(168,58,58,0.15); background: var(--bg-elevated); position: relative; }
    .seal-logo::after { content: ''; position: absolute; inset: 4px; border: 1px dashed rgba(168,58,58,0.25); border-radius: 50%; }
    .seal-logo span { color: var(--vermillion-bright); font-family: Georgia, serif; }
    .gate-title { text-align: center; font-size: 13px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 24px; }

    .gq { font-size: 13px; color: var(--water-bright); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .gq::before { content: '水'; font-size: 13px; color: var(--vermillion); font-family: "Songti SC", serif; }
    .gtext { font-size: 14px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }
    .gtext b { color: var(--text-main); font-weight: normal; }

    .gopts { display: flex; flex-direction: column; gap: 9px; }
    .gbtn { background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 12px 15px; text-align: left; border-radius: 2px; transition: all 0.2s; font-size: 14px; line-height: 1.6; color: var(--text-main); }
    .gbtn:active { background: rgba(168,58,58,0.08); border-color: var(--vermillion); color: var(--vermillion-bright); }

    .gnote { margin-top: 14px; font-size: 12px; color: var(--water); line-height: 1.85; min-height: 20px; }

    .handwrite { font-size: 15px; color: var(--vermillion-bright); line-height: 2; padding: 16px; border-left: 2px solid var(--vermillion); background: rgba(168,58,58,0.04); margin: 18px 0; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; }
    .handwrite.show { opacity: 1; transform: none; }

    .stamp { display: inline-block; border: 2px solid var(--vermillion); color: var(--vermillion); padding: 5px 15px; font-size: 13px; font-weight: bold; letter-spacing: 2px; transform: rotate(-2deg); margin-bottom: 18px; opacity: 0; }
    .stamp.show { opacity: 1; animation: stampIn 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes stampIn { 0% { transform: rotate(-10deg) scale(2); opacity: 0; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }

    .enter-btn { width: 100%; background: transparent; border: 1px solid var(--vermillion); color: var(--vermillion); padding: 12px; font-size: 15px; letter-spacing: 5px; border-radius: 2px; margin-top: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; }
    .enter-btn.show { opacity: 1; pointer-events: auto; }
    .enter-btn:active { background: rgba(168,58,58,0.1); }

    /* ============ 主体 ============ */
    #app { display: none; max-width: 540px; margin: 0 auto; padding: 0 15px 50px; opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: rgba(10,12,16,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-dim); margin-bottom: 15px; }
    .h-left { display: flex; align-items: center; gap: 11px; }
    .h-seal { width: 34px; height: 34px; border: 1px solid var(--vermillion); color: var(--vermillion); display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 50%; background: var(--bg-elevated); font-family: "Songti SC", serif; }
    .h-title { font-size: 14px; color: var(--text-main); letter-spacing: 1px; }
    .h-sub { font-size: 11px; color: var(--water); letter-spacing: 0.5px; }
    .pill { border: 1px solid var(--border-dim); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); transition: 0.2s; background: var(--bg-card); }
    .pill.on { border-color: var(--vermillion); color: var(--vermillion); background: rgba(168,58,58,0.08); }

    .card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 2px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--vermillion), var(--water), transparent); opacity: 0.5; }
    .card-title { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-dim), transparent); }

    .total-num { font-size: 31px; color: var(--vermillion-bright); font-family: Georgia, serif; text-shadow: 0 0 20px rgba(168,58,58,0.2); cursor: pointer; word-break: break-all; transition: text-shadow 0.2s; }
    .total-num:active { text-shadow: 0 0 32px rgba(212,106,90,0.7); }
    .total-meta { font-size: 12px; color: var(--water); margin-top: 5px; }
    .total-note { font-size: 12px; color: var(--jade-bright); margin-top: 10px; min-height: 18px; line-height: 1.7; }

    .chart-row { margin-bottom: 10px; }
    .chart-row:last-child { margin-bottom: 0; }
    .chart-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .chart-val { color: var(--vermillion-bright); font-family: Georgia, serif; }
    .chart-track { height: 5px; background: var(--bg-elevated); border-radius: 1px; overflow: hidden; }
    .chart-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--water), var(--vermillion)); transition: width 0.1s linear; }

    .asset-cat { margin-bottom: 4px; }
    .cat-head { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-dim); color: var(--water-bright); font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }
    .cat-val { color: var(--vermillion-bright); font-family: Georgia, serif; font-weight: normal; }
    .asset-item { padding: 10px 0; border-bottom: 1px dashed var(--border-dim); }
    .asset-item:last-child { border-bottom: none; }
    .ai-top { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
    .ai-top span:first-child { flex: 1; }
    .ai-val { color: var(--vermillion-bright); font-family: Georgia, serif; white-space: nowrap; }
    .ai-note { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }

    /* 私密空间 */
    .priv-locked { text-align: center; padding: 15px 0; }
    .lock-text { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 2px; }
    .gold-btn { border: 1px solid var(--vermillion); color: var(--vermillion); padding: 8px 24px; border-radius: 2px; font-size: 13px; letter-spacing: 2px; transition: 0.2s; background: var(--bg-card); }
    .gold-btn:active { background: rgba(168,58,58,0.1); }

    .priv-note { font-size: 12px; color: var(--text-dim); padding-bottom: 10px; border-bottom: 1px dashed var(--border-dim); margin-bottom: 10px; line-height: 1.7; }
    .pitem { border-bottom: 1px dashed var(--border-dim); }
    .pitem:last-child { border-bottom: none; }
    .pitem-head { width: 100%; text-align: left; padding: 12px 0; font-size: 14px; display: flex; justify-content: space-between; transition: color 0.2s; gap: 10px; }
    .pitem-head span:first-child { flex: 1; }
    .pitem-head:active { color: var(--vermillion); }
    .pitem-head::before { content: '名'; margin-right: 8px; font-size: 11px; color: var(--water); font-family: "Songti SC", serif; }
    .pitem-body { padding-bottom: 15px; display: none; }
    .pitem.open .pitem-body { display: block; animation: fadeIn 0.3s ease; }
    .pstory { font-size: 13px; color: var(--text-main); line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--jade); margin-bottom: 12px; }
    .popt { display: block; width: 100%; text-align: left; background: var(--bg-elevated); border: 1px solid var(--border-dim); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 2px; transition: 0.2s; line-height: 1.6; }
    .popt:active { border-color: var(--vermillion); color: var(--vermillion-bright); }
    .pres { font-size: 13px; color: var(--vermillion-bright); padding: 11px 12px; border: 1px solid rgba(168,58,58,0.3); background: rgba(168,58,58,0.04); border-radius: 2px; animation: fadeIn 0.3s ease; line-height: 1.75; }

    /* 消息浮层 */
    #msg-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; pointer-events: none; display: none; }
    .msg-card { background: var(--bg-elevated); border: 1px solid var(--vermillion); border-radius: 2px; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.85); pointer-events: auto; position: relative; animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.1) both; max-width: 540px; margin: 0 auto; }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg-from { font-size: 11px; color: var(--vermillion); margin-bottom: 6px; letter-spacing: 2px; }
    .msg-text { font-size: 14px; color: var(--text-main); margin-bottom: 12px; padding-right: 20px; line-height: 1.75; }
    .msg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .msg-btn { background: var(--bg-base); border: 1px solid var(--border-dim); padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-radius: 2px; transition: 0.2s; }
    .msg-btn:active { border-color: var(--vermillion); color: var(--vermillion-bright); }
    .msg-x { position: absolute; top: 10px; right: 10px; font-size: 18px; color: var(--text-dim); padding: 5px; transition: color 0.2s; }
    .msg-x:active { color: var(--vermillion); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg-elevated); border: 1px solid var(--vermillion); color: var(--vermillion-bright); padding: 9px 16px; border-radius: 2px; font-size: 13px; z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; max-width: 90vw; line-height: 1.6; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- 验证入口 -->
<div id="gate">
    <div class="gate-box">
        <div class="seal-logo"><span>沈</span></div>
        <div class="gate-title">M A N O N W I R E · 沈 沉 沉 的 刻 名 账 本</div>
        <div id="gateStep"></div>
        <div class="gnote" style="text-align: center; margin-top: 18px;">刻了名字，就是他的了</div>
    </div>
</div>

<!-- 主体 -->
<div id="app">
    <div class="header">
        <div class="h-left">
            <div class="h-seal">沈</div>
            <div>
                <div class="h-title">沈沉沉的刻名账本</div>
                <div class="h-sub" id="permLabel">权限：留了名的人</div>
            </div>
        </div>
        <button class="pill" id="pauseBtn">暂停消息</button>
    </div>

    <div class="card">
        <div class="card-title">全部家当</div>
        <div class="total-num" id="totalNum">0</div>
        <div class="total-meta" id="rateInfo">每秒进项 +0</div>
        <div class="total-note" id="totalNote"></div>
    </div>

    <div class="card">
        <div class="card-title">家当配比</div>
        <div id="chart"></div>
    </div>

    <div class="card">
        <div class="card-title">明细</div>
        <div id="assetList"></div>
    </div>

    <div class="card">
        <div class="card-title">刻了名的东西</div>
        <div id="privBody"></div>
    </div>
</div>

<!-- 消息浮层 -->
<div id="msg-wrap">
    <div class="msg-card">
        <button class="msg-x" id="msgX">×</button>
        <div class="msg-from">沈 沉 沉</div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-opts" id="msgOpts"></div>
    </div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    const fmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    /* ================= 数据配置 ================= */
    const DATA = [
        {
            cat: '江天楼 · 演出与身价',
            short: '演出身价',
            items: [
                { n: '江天楼演出票房存底', b: 68000000, r: 2400, note: '十四岁便已成为人尽皆知的角儿。' },
                { n: '江城子的名号估值', b: 32000000, r: 1200, note: '江自照取的别名。江城子。' },
                { n: '流行音乐领域跨界收入', b: 8600000, r: 600, note: '除传统戏曲和乐器外，也有一番造诣。' }
            ]
        },
        {
            cat: '御水 · 能力估值',
            short: '御水估值',
            items: [
                { n: '御水能力（非卖品）', b: 0, r: 0, note: '非卖品。水随声起，仅用于戏台。' },
                { n: '“值得观察的人类样本”估值', b: 0, r: 0, note: '999城人工智能判定。无法计价。' }
            ]
        },
        {
            cat: '沈沉沉 · 个人持有',
            short: '个人持有',
            items: [
                { n: '刻了名的扇子', b: 0, r: 0, note: '扇骨上刻着“沈沉沉”。是他的。' },
                { n: '刻了名的伞', b: 0, r: 0, note: '伞骨上刻着“沈沉沉”。雨后的伞。' },
                { n: '绣了名的手帕', b: 0, r: 0, note: '手帕上绣着“沈沉沉”。一针一线。' },
                { n: '戏服与头面', b: 46000, r: 3, note: '赤色羽衣。站在冰湖上的那件。' }
            ]
        },
        {
            cat: '你 · 留了名',
            short: '留了名',
            items: [
                { n: '如伞骨上的刻字，如手帕上的绣字，如你', b: 0, r: 0, note: '留了名，就是他的了。' }
            ]
        }
    ];

    let T0 = 0;
    let updateTimer = null;

    /* ================= 入口验证 ================= */
    let gateStep = 0;
    const gateEl = document.getElementById('gateStep');

    function renderGate() {
        if (gateStep === 0) {
            gateEl.innerHTML = `
                <div class="gq">壹 · 来者何人</div>
                <div class="gtext">这是沈沉沉的账本。他正在擦一把扇子，扇骨上刻着字。<br><b>你身上有他的名字吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="audience">听 戏 的 观 众</button>
                    <button class="gbtn" data-v="friend">江 天 楼 的 熟 人</button>
                    <button class="gbtn" data-v="named">身 上 有 他 名 字 的 人</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'named') {
                        document.getElementById('gNote').innerText = "他放下扇子，看了你很久。然后低下头，继续擦扇骨。\n「……嗯。留了名，就是我的了。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 2600);
                    } else if (btn.dataset.v === 'friend') {
                        document.getElementById('gNote').innerText = "「熟人。嗯。熟人不会看账本。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    } else {
                        document.getElementById('gNote').innerText = "「听戏的？那先回答我一题。答对了，给你看。」";
                        setTimeout(() => { gateStep = 1; renderGate(); }, 1800);
                    }
                };
            });
        } else if (gateStep === 1) {
            gateEl.innerHTML = `
                <div class="gq">贰 · 刻名校验</div>
                <div class="gtext">他在意的东西，都会刻上自己的名字。<br><b>为什么？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="a">因为怕丢</button>
                    <button class="gbtn" data-v="b">因为刻了名，就是他的了</button>
                    <button class="gbtn" data-v="c">因为习惯了</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelectorAll('.gbtn').forEach(btn => {
                btn.onclick = () => {
                    if (btn.dataset.v === 'b') {
                        gateStep = 2; renderGate();
                    } else {
                        document.getElementById('gNote').innerText = "「不对。再想。」";
                    }
                };
            });
        } else if (gateStep === 2) {
            gateEl.innerHTML = `
                <div class="gq">叁 · 确认</div>
                <div class="gtext">账本里有票房、御水、刻了名的扇子和伞。<br><b>你确定要看吗？</b></div>
                <div class="gopts">
                    <button class="gbtn" data-v="yes">看 吧，我 不 怕 留 名</button>
                </div>
                <div class="gnote" id="gNote"></div>
            `;
            gateEl.querySelector('.gbtn').onclick = () => {
                document.getElementById('gNote').innerText = "「那进来吧。……手伸出来。」";
                setTimeout(() => { gateStep = 3; renderGate(); }, 1600);
            };
        } else {
            gateEl.innerHTML = `
                <div class="gq">肆 · 沈沉沉的话</div>
                <div class="handwrite" id="hw">「我不过是又去唱了一台戏，<br>只是这次扮作英雄相。<br><br>玉怎么捂在心口都是冷的，<br>如今你回来了，<br>暖玉也知生香了。<br><br>——留了名，<br>就是我的了。<br>如你。」</div>
                <div id="stampBox"></div>
            `;
            setTimeout(() => { document.getElementById('hw').classList.add('show'); }, 500);
            setTimeout(() => {
                document.getElementById('stampBox').innerHTML = `
                    <div class="stamp show">已刻名：沈沉沉</div>
                    <button class="enter-btn show" id="enterBtn">翻 开 账 本</button>
                `;
                document.getElementById('enterBtn').onclick = enterApp;
            }, 3000);
        }
    }

    /* ================= 进入主体 ================= */
    function enterApp() {
        document.getElementById('gate').style.display = 'none';
        const app = document.getElementById('app');
        app.style.display = 'block';
        setTimeout(() => app.classList.add('show'), 50);

        T0 = performance.now();
        buildAssets();
        buildChart();
        updateAll();

        if (updateTimer) clearInterval(updateTimer);
        updateTimer = setInterval(updateAll, 100);

        scheduleMsg(7000);
    }

    /* ================= 资产系统 ================= */
    function buildAssets() {
        const wrap = document.getElementById('assetList');
        let html = '';
        DATA.forEach((c, ci) => {
            html += `<div class="asset-cat">
                <div class="cat-head"><span>${c.cat}</span><span class="cat-val" id="c_${ci}">—</span></div>`;
            c.items.forEach((it, ii) => {
                html += `<div class="asset-item">
                    <div class="ai-top"><span>${it.n}</span><span class="ai-val" id="v_${ci}_${ii}">—</span></div>
                    <div class="ai-note">${it.note}</div>
                </div>`;
            });
            html += '</div>';
        });
        wrap.innerHTML = html;
    }

    function buildChart() {
        const el = document.getElementById('chart');
        let html = '';
        DATA.forEach((c, i) => {
            html += `<div class="chart-row">
                <div class="chart-top"><span>${c.short}</span><span class="chart-val" id="chv_${i}">—</span></div>
                <div class="chart-track"><div class="chart-fill" id="bar_${i}"></div></div>
            </div>`;
        });
        el.innerHTML = html;

        let rate = 0;
        DATA.forEach(c => c.items.forEach(it => rate += it.r));
        document.getElementById('rateInfo').innerText = `每秒进项 +${fmt(rate)}`;
    }

    function updateAll() {
        const e = (performance.now() - T0) / 1000;
        let catVals = [];
        let total = 0;

        DATA.forEach((c, ci) => {
            let s = 0;
            c.items.forEach((it, ii) => {
                let v = it.b + it.r * e;
                s += v;
                const node = document.getElementById(`v_${ci}_${ii}`);
                if (node) {
                    if (it.b === 0 && it.r === 0) {
                        node.innerText = it.note.includes('如你') ? '留了名' : '非卖品';
                    } else {
                        node.innerText = fmt(v);
                    }
                }
            });
            catVals.push(s);
            total += s;
            const cn = document.getElementById(`c_${ci}`);
            if (cn) cn.innerText = (s === 0) ? '—' : fmt(s);
        });

        document.getElementById('totalNum').innerText = fmt(total);

        const max = Math.max(...catVals, 1);
        catVals.forEach((v, i) => {
            const bar = document.getElementById(`bar_${i}`);
            if (bar) bar.style.width = (v <= 0 ? 0 : Math.max(1, (v / max) * 100)) + '%';
            const cv = document.getElementById(`chv_${i}`);
            if (cv) cv.innerText = (v <= 0) ? '无价' : fmt(v);
        });
    }

    /* ================= 消息系统 ================= */
    const MSGS = [
        { t: '扇子上的刻字，你看到了吗。刻得很深。不会掉的。', o: [
            { l: '刻了多久', r: '「刻了很久。一笔一划。急不得。」' },
            { l: '我也想要一个', r: '「……手伸出来。现在刻。」' }
        ]},
        { t: '我师父江自照，植入了芯片。但听到我唱戏的时候，又出现了情感特征。', o: [
            { l: '他记得你吗', r: '「不知道。但他听戏的时候，眼睛会动。我觉得……他记得。」' },
            { l: '你会一直唱给他听吗', r: '「会。唱到他真的忘了为止。或者，唱到他回来。」' }
        ]},
        { t: '999城说我是“值得观察的人类样本”。我不太懂。但如果你要观察，可以近一点。', o: [
            { l: '那我近一点', r: '「……嗯。再近一点也没关系。」' },
            { l: '观察什么', r: '「观察我……什么时候会脸红。大概是现在。」' }
        ]},
        { t: '那天在冰湖上，我在你掌心写了一个字。然后又抹掉了。', o: [
            { l: '写了什么', r: '「写了“沈”。本来想写全名的。但觉得……先写一个姓，慢慢来。」' },
            { l: '为什么要抹掉', r: '「因为雪还会再下。千秋岁月很长，我们可以慢慢看，慢慢走。」' }
        ]}
    ];

    let msgIdx = 0, msgTimer = null, msgOpen = false, msgPaused = false;

    function scheduleMsg(delay) {
        clearTimeout(msgTimer);
        if (msgPaused) return;
        msgTimer = setTimeout(() => {
            if (msgPaused || msgOpen) return;
            showMsg();
        }, delay || 15000);
    }

    function showMsg() {
        const m = MSGS[msgIdx % MSGS.length];
        msgIdx++;
        msgOpen = true;
        document.getElementById('msgText').innerText = m.t;
        const opts = document.getElementById('msgOpts');
        opts.innerHTML = '';

        m.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'msg-btn';
            b.innerText = o.l;
            b.onclick = () => {
                opts.innerHTML = `<div class="pres">${o.r}</div>`;
                setTimeout(closeMsg, 3200);
            };
            opts.appendChild(b);
        });

        document.getElementById('msg-wrap').style.display = 'block';
    }

    function closeMsg() {
        const scrollPos = window.scrollY;
        document.getElementById('msg-wrap').style.display = 'none';
        msgOpen = false;
        window.scrollTo(0, scrollPos);
        scheduleMsg(15000);
    }

    document.getElementById('msgX').onclick = closeMsg;

    document.getElementById('pauseBtn').onclick = function() {
        msgPaused = !msgPaused;
        this.innerText = msgPaused ? '恢复消息' : '暂停消息';
        this.classList.toggle('on', msgPaused);
        if (msgPaused) clearTimeout(msgTimer);
        else if (!msgOpen) scheduleMsg(3000);
    };

    /* ================= 刻了名的东西 ================= */
    const PRIV = [
        { id: 'fan', name: '那把刻了名的扇子', story: '扇骨上刻着“沈沉沉”三个字。刻得很深，一笔一划，像是怕它跑掉。', opts: [
            { l: '问他刻了多久', r: '「很久。刻坏了好几把。这把最好。」' },
            { l: '说也想被刻上去', r: '「……你不一样。你是绣上去的。慢慢绣。」' }
        ]},
        { id: 'umbrella', name: '伞骨上的刻字特写', story: '雨后的伞，伞骨上刻着“沈沉沉”。他说，是他的，便留下名字，小心对待。', opts: [
            { l: '问他为什么是伞', r: '「因为雨会停。但伞还在。刻了名，就一直在。」' },
            { l: '说这把伞很好看', r: '「送你了。刻了名，你也是我的了。」' }
        ]},
        { id: 'snow', name: '掌心融雪里被抹掉的那个字', story: '冰湖上，他指尖在你掌心勾了一个字。又抹掉了。雪还在下，字已经化了。', opts: [
            { l: '问他写的什么', r: '「沈。先写一个姓。剩下的……慢慢来。」' },
            { l: '说想让他写完', r: '「……好。下次下雪的时候，写全名。不抹了。」' }
        ]},
        { id: 'record', name: '江自照听戏时恢复情感的记录', story: '一段很短的录像。江自照坐在台下，听到某一句时，眼睛动了一下。就那么一下。', opts: [
            { l: '问他当时唱的是哪句', r: '「“……暖玉也知生香”。唱到这里的时候，他看了我一眼。」' },
            { l: '说他会回来的', r: '「……嗯。我信。所以一直唱。」' }
        ]}
    ];

    const EGG = {
        id: 'name',
        name: '他握着你的手，指尖在你掌心写字',
        story: '一笔一划。先写“沈”，再写“沉”，再写“沉”。写完了。这次没有抹掉。',
        opts: [
            { l: '握紧他的手', r: '「……好了。现在你是我的了。刻好了。」' },
            { l: '问他为什么不抹了', r: '「因为雪还会再下，但这次我不想再等了。」' }
        ]
    };

    let privState = {};
    PRIV.forEach(p => privState[p.id] = { open: false, chosen: null });
    let privOpened = false, eggUnlocked = false;

    function renderPriv() {
        const body = document.getElementById('privBody');
        if (!privOpened) {
            body.innerHTML = `<div class="priv-locked">
                <div class="lock-text">刻 了 名 的 东 西</div>
                <button class="gold-btn" id="openPriv">看 看 他 刻 了 什 么</button>
            </div>`;
            document.getElementById('openPriv').onclick = () => {
                privOpened = true;
                renderPriv();
                toast('「这些东西……都刻了名。你看可以，别碰。」');
            };
            return;
        }

        const list = PRIV.slice();
        if (eggUnlocked) list.push(EGG);

        let html = `<div class="priv-note">「刻了名字的，都是我的。……你也是。」</div>`;
        list.forEach(p => {
            const st = privState[p.id] || (privState[p.id] = { open: false, chosen: null });
            html += `<div class="pitem ${st.open ? 'open' : ''}">
                <button class="pitem-head" data-act="toggle" data-id="${p.id}">
                    <span>${p.name}</span><span>${st.open ? '−' : '+'}</span>
                </button>`;
            if (st.open) {
                html += `<div class="pitem-body">
                    <div class="pstory">${p.story}</div>`;
                if (st.chosen === null) {
                    p.opts.forEach((o, oi) => {
                        html += `<button class="popt" data-act="opt" data-id="${p.id}" data-oi="${oi}">${o.l}</button>`;
                    });
                } else {
                    html += `<div class="pres">${p.opts[st.chosen].r}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        });
        body.innerHTML = html;
    }

    document.getElementById('privBody').onclick = (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const id = t.dataset.id;
        const st = privState[id];
        if (!st) return;

        if (t.dataset.act === 'toggle') {
            st.open = !st.open;
            renderPriv();
        } else if (t.dataset.act === 'opt') {
            st.chosen = parseInt(t.dataset.oi, 10);
            renderPriv();
            checkEgg();
        }
    };

    function checkEgg() {
        if (eggUnlocked) return;
        const allDone = PRIV.every(p => privState[p.id] && privState[p.id].chosen !== null);
        if (!allDone) return;
        eggUnlocked = true;
        setTimeout(() => {
            renderPriv();
            toast('他握住了你的手。');
        }, 1000);
    }

    /* ================= 彩蛋与反馈 ================= */
    let tapN = 0;
    document.getElementById('totalNum').onclick = () => {
        tapN++;
        const note = document.getElementById('totalNote');
        if (tapN === 5) note.innerText = '账本边角刻了一个字：“沈”。刻得很深。';
        else if (tapN === 10) note.innerText = '“再点，我就把你名字也刻上去。”';
        else if (tapN === 15) note.innerText = '“行。你赢了。手伸出来。……刻好了。”';
    };

    let toastTimer;
    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // 启动验证
    renderGate();

})();
</script>
</body>
</html>
